name: Directly restore Cloudflare proxy for standalone FMB News

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-proxy-zone-direct.yml'

permissions:
  contents: read

jobs:
  restore-proxy:
    if: github.event.head_commit.message == 'Directly restore Cloudflare proxy for standalone FMB News'
    runs-on: ubuntu-latest
    steps:
      - name: Proxy apex and www through Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          api='https://api.cloudflare.com/client/v4'
          zone_id='2e2210f55eba305e10b3f3f0f4a20261'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          for hostname in francinemariebautista.com www.francinemariebautista.com; do
            records="$(curl --fail --silent --show-error "${auth[@]}" "${api}/zones/${zone_id}/dns_records?name=${hostname}")"
            printf '%s' "$records" | jq -e '.success == true' >/dev/null
            count="$(printf '%s' "$records" | jq '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | length')"
            test "$count" -gt 0

            printf '%s' "$records" | jq -c '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")' | while IFS= read -r record; do
              record_id="$(printf '%s' "$record" | jq -r '.id')"
              current="$(printf '%s' "$record" | jq -r '.proxied')"
              if [ "$current" = 'true' ]; then
                echo "${hostname}: already proxied"
                continue
              fi
              response="$(curl --fail --silent --show-error -X PATCH "${auth[@]}" \
                "${api}/zones/${zone_id}/dns_records/${record_id}" \
                --data '{"proxied":true}')"
              printf '%s' "$response" | jq -e '.success == true and .result.proxied == true' >/dev/null
              echo "${hostname}: Cloudflare proxy enabled"
            done
          done

      - name: Verify approved standalone newsroom owns /news
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            rm -f /tmp/fmb.headers /tmp/fmb.html
            curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/fmb.headers \
              "https://www.francinemariebautista.com/news/?approved-restore=${GITHUB_SHA}-${attempt}" \
              -o /tmp/fmb.html || true

            if tr -d '\r' < /tmp/fmb.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$' \
              && grep -qi 'FMB News' /tmp/fmb.html \
              && grep -qi 'FMB Worldwide' /tmp/fmb.html \
              && grep -qi 'FMB Explainer' /tmp/fmb.html \
              && grep -qi 'FMB Fact Check' /tmp/fmb.html \
              && grep -qi 'FMB Daily Brief' /tmp/fmb.html; then
              echo 'APPROVED FMB NEWS IS LIVE: standalone Worker owns /news.'
              exit 0
            fi
            echo "Waiting for Cloudflare proxy propagation (${attempt}/24)..."
            sleep 10
          done

          echo '::error::DNS proxy update did not produce the standalone /news response in time.'
          cat /tmp/fmb.headers || true
          exit 1
