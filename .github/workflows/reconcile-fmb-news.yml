name: Reconcile FMB News migration

on:
  push:
    branches: [main]
    paths:
      - .reconcile-trigger

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FMBNews
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Check out FMB-Ecosystem source
        uses: actions/checkout@v4
        with:
          repository: masinlocandher-max/FMB-Ecosystem
          ref: main
          path: source
          fetch-depth: 1

      - name: Reconcile all newsroom content
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/apps/withlovefmb"
          DST="$GITHUB_WORKSPACE/target"
          REPORT="$DST/migration/reconciliation-report.txt"
          DIFFROOT="$RUNNER_TEMP/fmb-news-reconcile"
          mkdir -p "$DST/migration" "$DIFFROOT"

          SOURCE_SHA=$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)
          TARGET_SHA=$(git -C "$DST" rev-parse HEAD)
          STATUS=0

          {
            echo "FMB NEWS MIGRATION RECONCILIATION"
            echo "Generated (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Source: masinlocandher-max/FMB-Ecosystem@$SOURCE_SHA"
            echo "Target: masinlocandher-max/FMBNews@$TARGET_SHA"
            echo
          } > "$REPORT"

          compare_tree() {
            local label="$1"
            local left="$2"
            local right="$3"
            local out="$DIFFROOT/${label// /_}.txt"
            echo "== $label ==" >> "$REPORT"
            if diff -qr "$left" "$right" > "$out" 2>&1; then
              echo "PASS: byte-for-byte identical" >> "$REPORT"
            else
              echo "FAIL: differences found" >> "$REPORT"
              cat "$out" >> "$REPORT"
              STATUS=1
            fi
            echo >> "$REPORT"
          }

          # Every rendered newsroom page, including individual reports, Brief and Worldwide.
          compare_tree "Rendered newsroom tree" "$SRC/news" "$DST/site"

          # Every structured editorial source record and newsroom metadata file.
          compare_tree "Structured editorial content" "$SRC/content/news" "$DST/content/news"

          # Every News-specific image copied during migration.
          compare_tree "News image library" "$SRC/assets/images/news" "$DST/public/assets/images/news"

          SOURCE_HTML=$(find "$SRC/news" -type f -name '*.html' | wc -l | tr -d ' ')
          TARGET_HTML=$(find "$DST/site" -type f -name '*.html' | wc -l | tr -d ' ')
          SOURCE_INDEX=$(find "$SRC/news" -type f -name 'index.html' | wc -l | tr -d ' ')
          TARGET_INDEX=$(find "$DST/site" -type f -name 'index.html' | wc -l | tr -d ' ')
          SOURCE_RECORDS=$(find "$SRC/content/news/articles" -type f | wc -l | tr -d ' ')
          TARGET_RECORDS=$(find "$DST/content/news/articles" -type f | wc -l | tr -d ' ')
          SOURCE_IMAGES=$(find "$SRC/assets/images/news" -type f | wc -l | tr -d ' ')
          TARGET_IMAGES=$(find "$DST/public/assets/images/news" -type f | wc -l | tr -d ' ')

          {
            echo "== Inventory counts =="
            echo "Rendered HTML files: source=$SOURCE_HTML target=$TARGET_HTML"
            echo "Rendered index pages: source=$SOURCE_INDEX target=$TARGET_INDEX"
            echo "Structured article files: source=$SOURCE_RECORDS target=$TARGET_RECORDS"
            echo "News image files: source=$SOURCE_IMAGES target=$TARGET_IMAGES"
            echo
          } >> "$REPORT"

          if [ "$SOURCE_HTML" != "$TARGET_HTML" ] || [ "$SOURCE_INDEX" != "$TARGET_INDEX" ] || [ "$SOURCE_RECORDS" != "$TARGET_RECORDS" ] || [ "$SOURCE_IMAGES" != "$TARGET_IMAGES" ]; then
            echo "FAIL: inventory counts do not match" >> "$REPORT"
            STATUS=1
          else
            echo "PASS: inventory counts match" >> "$REPORT"
          fi
          echo >> "$REPORT"

          # Check every local /assets/... reference in migrated HTML and CSS against the standalone public tree.
          python3 - "$DST" "$REPORT" <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(sys.argv[1])
          report = pathlib.Path(sys.argv[2])
          refs = set()
          scan_files = list((root / 'site').rglob('*.html')) + list((root / 'public' / 'assets' / 'css').glob('*.css')) + list((root / 'public' / 'assets' / 'js').glob('*.js'))
          rx = re.compile(r'''(?:src|href)=["'](/assets/[^"'#?]+)|url\(["']?(/assets/[^)"'?]+)''', re.I)
          for file in scan_files:
              try:
                  text = file.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              for match in rx.finditer(text):
                  ref = match.group(1) or match.group(2)
                  if ref:
                      refs.add(ref)
          missing = []
          for ref in sorted(refs):
              local = root / 'public' / ref.lstrip('/')
              if not local.exists():
                  missing.append(ref)
          with report.open('a', encoding='utf-8') as f:
              f.write('== Local asset reference scan ==\n')
              f.write(f'Unique /assets/ references scanned: {len(refs)}\n')
              if missing:
                  f.write(f'FAIL: {len(missing)} referenced local assets are missing\n')
                  for ref in missing:
                      f.write(f'MISSING {ref}\n')
              else:
                  f.write('PASS: every local /assets/ reference resolves inside FMBNews\n')
              f.write('\n')
          if missing:
              sys.exit(3)
          PY
          ASSET_STATUS=$?
          if [ "$ASSET_STATUS" -ne 0 ]; then STATUS=1; fi

          # Standalone build and repository verifier.
          cd "$DST"
          if npm run build >> "$REPORT" 2>&1 && npm run verify >> "$REPORT" 2>&1; then
            echo >> "$REPORT"
            echo "PASS: standalone build and verifier" >> "$REPORT"
          else
            echo >> "$REPORT"
            echo "FAIL: standalone build or verifier" >> "$REPORT"
            STATUS=1
          fi

          echo >> "$REPORT"
          if [ "$STATUS" -eq 0 ]; then
            echo "FINAL: PASS — no missing migrated articles/pages/content/images detected, and all local asset references resolve." >> "$REPORT"
          else
            echo "FINAL: FAIL — reconciliation found differences or missing dependencies. Do not disconnect the legacy source." >> "$REPORT"
          fi

          # Store status for the final step without losing the report.
          echo "$STATUS" > "$RUNNER_TEMP/reconcile-status"

      - name: Commit reconciliation report
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/reconciliation-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record FMB News migration reconciliation"
            git push origin HEAD:main
          fi

      - name: Enforce reconciliation result
        shell: bash
        run: |
          STATUS=$(cat "$RUNNER_TEMP/reconcile-status")
          if [ "$STATUS" -ne 0 ]; then
            echo "FMB News migration reconciliation failed. See migration/reconciliation-report.txt"
            exit 1
          fi
