name: Verify standalone FMB News

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone newsroom
        run: npm run build
      - name: Verify canonical newsroom surfaces
        run: npm run verify
      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/news/index.html
          test -f dist/news/archive/index.html
          test -f dist/news/fmb-brief/index.html
          test -f dist/news/world/index.html
          test -f dist/news/subic-aeta-landfill/index.html
          test -f dist/news/assets/css/fmb-news-final.css
          test -f dist/news/assets/css/fmb-news-mobile-first-site.css
          test -f dist/news/assets/js/fmb-news-approved.js
          test -f dist/news/assets/js/fmb-news-cms.js

          grep -q "FMB News" dist/news/index.html
          grep -q "FMB Worldwide" dist/news/index.html
          grep -q "FMB Daily Brief" dist/news/index.html
          grep -q "FMB Worldwide" dist/news/world/index.html
          grep -q "FMB Daily Brief" dist/news/fmb-brief/index.html
          grep -q "Daily Newsletter" dist/news/fmb-brief/index.html
          grep -q "Filipino Media Bulletin" dist/news/index.html

          # Every generated page must use the same website-level mobile-first system.
          total_pages="$(find dist/news -type f -name index.html | wc -l | tr -d ' ')"
          mobile_first_pages="$(grep -rl 'fmb-news-mobile-first-site.css' dist/news --include='index.html' | wc -l | tr -d ' ')"
          test "$total_pages" -eq "$mobile_first_pages"
          grep -q 'fmb-mobile-first' dist/news/index.html
          grep -q 'fmb-mobile-first' dist/news/archive/index.html
          grep -q 'fmb-mobile-first' dist/news/fmb-brief/index.html
          grep -q 'fmb-mobile-first' dist/news/world/index.html
          grep -q 'fmb-mobile-first' dist/news/subic-aeta-landfill/index.html

          # The universal layer itself is mobile-first: desktop only expands with min-width.
          grep -q '@media (min-width:700px)' dist/news/assets/css/fmb-news-mobile-first-site.css
          grep -q '@media (min-width:1000px)' dist/news/assets/css/fmb-news-mobile-first-site.css
          ! grep -qE '@media[[:space:]]*\(max-width' dist/news/assets/css/fmb-news-mobile-first-site.css

          # FMB News is a mobile-first website, not a separate app UI.
          ! grep -R -E 'fmb-news-mobile-(app|image-quality|readability)\.(css|js)' dist/news --include='*.html'
          ! grep -R -E 'apple-mobile-web-app|mobile-web-app-capable' dist/news --include='*.html'
          ! grep -R -E 'nc-mobile-dock|fmb-app-dock|Mobile news navigation' dist/news --include='*.html'

          ! grep -R -E '(["'"'"'(=])\/assets\/' dist/news --include='*.html' --include='*.css' --include='*.js' --include='*.mjs'
          test "$(find dist/news/world -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -ge 1
          test "$(find dist/news -mindepth 2 -maxdepth 2 -type f -path '*/fmb-brief-*/index.html' | wc -l)" -ge 1
