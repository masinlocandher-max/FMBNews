name: Verify standalone FMB News

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone newsroom
        run: npm run build
      - name: Verify canonical newsroom surfaces
        run: npm run verify
      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/news/index.html
          test -f dist/news/fmb-brief/index.html
          test -f dist/news/world/index.html
          test -f dist/news/assets/css/fmb-news-final.css
          test -f dist/news/assets/js/fmb-news-approved.js
          test -f dist/news/assets/js/fmb-news-cms.js
          grep -q "FMB Brief" dist/news/index.html
          grep -q "FMB Worldwide" dist/news/index.html
          grep -q "FMB Worldwide" dist/news/world/index.html
          ! grep -R -E '(["'"'"'(=])\/assets\/' dist/news --include='*.html' --include='*.css' --include='*.js' --include='*.mjs'
          test "$(find dist/news/world -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -ge 1
          test "$(find dist/news -mindepth 2 -maxdepth 2 -type f -path '*/fmb-brief-*/index.html' | wc -l)" -ge 1
