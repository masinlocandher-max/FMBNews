name: Verify standalone FMB News

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone newsroom
        run: npm run build
      - name: Verify canonical newsroom surfaces
        run: npm run verify
      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/news/index.html
          test -f dist/news/archive/index.html
          test -f dist/news/fmb-brief/index.html
          test -f dist/news/world/index.html
          test -f dist/news/explainer/index.html
          test -f dist/news/subic-aeta-landfill/index.html
          test -f dist/news/manifest.webmanifest
          test -f dist/news/sw.js
          test -f dist/news/assets/css/fmb-news-final.css
          test -f dist/news/assets/css/fmb-news-mobile-first-site.css
          test -f dist/news/assets/css/fmb-news-mobile-personalization.css
          test -f dist/news/assets/js/fmb-news-approved.js
          test -f dist/news/assets/js/fmb-news-cms.js
          test -f dist/news/assets/js/fmb-news-mobile-personalization.js

          grep -q "FMB News" dist/news/index.html
          grep -q "FMB Worldwide" dist/news/index.html
          grep -q "FMB Explainer" dist/news/index.html
          grep -q "FMB Daily Brief" dist/news/index.html
          grep -q "FMB Worldwide" dist/news/world/index.html
          grep -q "FMB Explainer" dist/news/explainer/index.html
          grep -q "FMB Daily Brief" dist/news/fmb-brief/index.html
          grep -q "Filipino Media Bulletin" dist/news/index.html

          # Every generated page keeps one responsive publication shell.
          total_pages="$(find dist/news -type f -name index.html | wc -l | tr -d ' ')"
          responsive_pages="$(grep -rl 'fmb-news-mobile-first-site.css' dist/news --include='index.html' | wc -l | tr -d ' ')"
          test "$total_pages" -eq "$responsive_pages"
          grep -q 'fmb-mobile-first' dist/news/index.html
          grep -q 'fmb-mobile-first' dist/news/archive/index.html
          grep -q 'fmb-mobile-first' dist/news/fmb-brief/index.html
          grep -q 'fmb-mobile-first' dist/news/world/index.html
          grep -q 'fmb-mobile-first' dist/news/explainer/index.html

          # Official product navigation is normalized across core pages.
          for page in dist/news/index.html dist/news/archive/index.html dist/news/world/index.html dist/news/explainer/index.html dist/news/fmb-brief/index.html; do
            grep -q 'FMB News' "$page"
            grep -q 'FMB Worldwide' "$page"
            grep -q 'FMB Explainer' "$page"
            grep -q 'FMB Daily Brief' "$page"
          done

          # Desktop expands from the shared layout; mobile personalization itself is phone-scoped.
          grep -q '@media (min-width:700px)' dist/news/assets/css/fmb-news-mobile-first-site.css
          grep -q '@media(max-width:699px)' dist/news/assets/css/fmb-news-mobile-personalization.css
          grep -q 'fmb-news-mobile-personalization.js?v=20260901-personal-v2' dist/news/archive/index.html

          # PWA + real push plumbing must ship in the built newsroom.
          grep -q 'rel="manifest" href="/news/manifest.webmanifest"' dist/news/archive/index.html
          grep -q 'apple-mobile-web-app-capable' dist/news/archive/index.html
          grep -q 'serviceWorker.register' dist/news/assets/js/fmb-news-mobile-personalization.js
          grep -q 'news_push_subscriptions' dist/news/assets/js/fmb-news-mobile-personalization.js
          grep -q 'PushManager' dist/news/assets/js/fmb-news-mobile-personalization.js
          grep -q "addEventListener('push'" dist/news/sw.js
          grep -q "notificationclick" dist/news/sw.js
          grep -q 'preferred_sections' dist/news/assets/js/fmb-news-mobile-personalization.js
          grep -q 'rankFeed' dist/news/assets/js/fmb-news-mobile-personalization.js

          # Website mobile app experience must not use a fixed bottom dock.
          ! grep -R -E 'nc-mobile-dock|fmb-app-dock|Mobile news navigation' dist/news --include='*.html'

          ! grep -R -E '(["'"'"'(=])\/assets\/' dist/news --include='*.html' --include='*.css' --include='*.js' --include='*.mjs'
          test "$(find dist/news/world -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -ge 1
          test "$(find dist/news -mindepth 2 -maxdepth 2 -type f -path '*/fmb-brief-*/index.html' | wc -l)" -ge 1
