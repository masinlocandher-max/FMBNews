name: Verify standalone FMB News

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone newsroom
        run: npm run build
      - name: Verify canonical newsroom surfaces
        run: npm run verify
      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail

          for page in index archive world explainer fmb-brief horoscope crossword about; do
            if [ "$page" = index ]; then file="dist/news/index.html"; else file="dist/news/$page/index.html"; fi
            test -f "$file"
            grep -q 'FMB News' "$file"
            grep -q 'FMB Worldwide' "$file"
            grep -q 'FMB Explainer' "$file"
            grep -q 'FMB Daily Brief' "$file"
            grep -q 'fmb-news-mobile-personalization.css?v=20260901-personal-v3' "$file"
            grep -q 'fmb-news-mobile-home.css?v=20260901-app-home-v2' "$file"
            grep -q 'fmb-news-mobile-global.css?v=20260901-global-v3' "$file"
            grep -q 'fmb-news-mobile-global.js?v=20260901-global-v3' "$file"
            grep -q 'fmb-news-mobile-products.css?v=20260901-products-v1' "$file"
            grep -q 'fmb-news-mobile-products.js?v=20260901-products-v2' "$file"
          done

          test -f dist/news/manifest.webmanifest
          test -f dist/news/sw.js
          test -f dist/news/assets/images/mobile/fmb-mobile-hero.jpg
          test -f dist/news/assets/images/mobile/fmb-daily-brief-mug.jpg
          test "$(stat -c%s dist/news/assets/images/mobile/fmb-mobile-hero.jpg)" -gt 20000
          test "$(stat -c%s dist/news/assets/images/mobile/fmb-daily-brief-mug.jpg)" -gt 20000

          test -f dist/news/assets/css/fmb-news-mobile-global.css
          test -f dist/news/assets/css/fmb-news-mobile-products.css
          test -f dist/news/assets/css/fmb-news-mobile-features.css
          test -f dist/news/assets/css/fmb-news-mobile-personalization.css
          test -f dist/news/assets/js/fmb-news-mobile-global.js
          test -f dist/news/assets/js/fmb-news-mobile-products.js
          test -f dist/news/assets/js/fmb-news-weekly-horoscope.js
          test -f dist/news/assets/js/fmb-news-weekly-crossword.js

          grep -q 'min-height:44px' dist/news/assets/css/fmb-news-mobile-personalization.css
          grep -q 'z-index:2' dist/news/assets/css/fmb-news-mobile-personalization.css
          grep -q 'focus-visible' dist/news/assets/css/fmb-news-mobile-personalization.css

          grep -q 'fmb-mobile-route-archive' dist/news/assets/css/fmb-news-mobile-products.css
          grep -q 'fmb-mobile-route-world' dist/news/assets/css/fmb-news-mobile-products.css
          grep -q 'fmb-mobile-route-explainer' dist/news/assets/css/fmb-news-mobile-products.css
          grep -q 'fmb-mobile-route-brief' dist/news/assets/css/fmb-news-mobile-products.css
          grep -q 'fmb-mobile-route-horoscope' dist/news/assets/css/fmb-news-mobile-products.css
          grep -q 'fmb-mobile-route-crossword' dist/news/assets/css/fmb-news-mobile-products.css
          grep -q 'fmb-mobile-route-about' dist/news/assets/css/fmb-news-mobile-products.css
          grep -q 'fmb-mobile-route-article' dist/news/assets/css/fmb-news-mobile-products.css

          grep -q 'addArchiveIntro' dist/news/assets/js/fmb-news-mobile-products.js
          grep -q 'addWorldSignature' dist/news/assets/js/fmb-news-mobile-products.js
          grep -q 'addExplainerSignature' dist/news/assets/js/fmb-news-mobile-products.js
          grep -q 'addBriefSignature' dist/news/assets/js/fmb-news-mobile-products.js
          grep -q '.brief-archive-hero .brief-shell' dist/news/assets/js/fmb-news-mobile-products.js
          grep -q 'addHoroscopeSignature' dist/news/assets/js/fmb-news-mobile-products.js
          grep -q 'addCrosswordSignature' dist/news/assets/js/fmb-news-mobile-products.js
          grep -q 'addAboutSignature' dist/news/assets/js/fmb-news-mobile-products.js
          grep -q 'addArticleProgress' dist/news/assets/js/fmb-news-mobile-products.js

          grep -q 'Hindi hawak ng mga bituin ang ating kapalaran, meron tayong freewill gamitin natin' dist/news/horoscope/index.html
          for icon in '♈' '♉' '♊' '♋' '♌' '♍' '♎' '♏' '♐' '♑' '♒' '♓'; do grep -q "$icon" dist/news/assets/js/fmb-news-weekly-horoscope.js; done

          grep -q 'MIN_WORDS=35' dist/news/assets/js/fmb-news-weekly-crossword.js
          grep -q 'PAXSILICA' dist/news/assets/js/fmb-news-weekly-crossword.js
          grep -q 'IMPEACHMENT' dist/news/assets/js/fmb-news-weekly-crossword.js
          grep -q 'PADILLA' dist/news/assets/js/fmb-news-weekly-crossword.js
          grep -q 'HABAGAT' dist/news/assets/js/fmb-news-weekly-crossword.js
          grep -q 'PILANDOK' dist/news/assets/js/fmb-news-weekly-crossword.js
          grep -q 'releasedPuzzles=\[\]' dist/news/assets/js/fmb-news-weekly-crossword.js
          ! grep -E -q 'Reveal Letter|Reveal Word|Reveal Puzzle|data-cw-reveal' dist/news/crossword/index.html
          ! grep -E -q 'Reveal Letter|Reveal Word|Reveal Puzzle|data-cw-reveal' dist/news/assets/js/fmb-news-weekly-crossword.js

          ! grep -R -E '>FMB Explained<' dist/news --include='*.html'
          ! grep -R -E 'nc-mobile-dock|fmb-app-dock|Mobile news navigation' dist/news --include='*.html'
          ! grep -R -E '(["'"'"'(=])\/assets\/' dist/news --include='*.html' --include='*.css' --include='*.js' --include='*.mjs'

          total_pages="$(find dist/news -type f -name index.html | wc -l | tr -d ' ')"
          personal_pages="$(grep -rl 'fmb-news-mobile-personalization.css?v=20260901-personal-v3' dist/news --include='index.html' | wc -l | tr -d ' ')"
          global_pages="$(grep -rl 'fmb-news-mobile-global.css?v=20260901-global-v3' dist/news --include='index.html' | wc -l | tr -d ' ')"
          product_pages="$(grep -rl 'fmb-news-mobile-products.css?v=20260901-products-v1' dist/news --include='index.html' | wc -l | tr -d ' ')"
          product_js_pages="$(grep -rl 'fmb-news-mobile-products.js?v=20260901-products-v2' dist/news --include='index.html' | wc -l | tr -d ' ')"
          test "$total_pages" -eq "$personal_pages"
          test "$total_pages" -eq "$global_pages"
          test "$total_pages" -eq "$product_pages"
          test "$total_pages" -eq "$product_js_pages"

          grep -q 'rel="manifest" href="/news/manifest.webmanifest"' dist/news/index.html
          grep -q 'serviceWorker.register' dist/news/assets/js/fmb-news-mobile-personalization.js
          grep -q 'news_push_subscriptions' dist/news/assets/js/fmb-news-mobile-personalization.js
          grep -q "addEventListener('push'" dist/news/sw.js
          grep -q 'notificationclick' dist/news/sw.js
