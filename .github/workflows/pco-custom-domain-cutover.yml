name: Cut root to PCO via Cloudflare Custom Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pco-custom-domain-cutover.yml'

permissions:
  contents: read

jobs:
  cutover:
    if: github.event.head_commit.message == 'Cut root to PCO via Cloudflare Custom Domain'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FMBNews infrastructure repo
        uses: actions/checkout@v4

      - name: Checkout canonical PCO source
        uses: actions/checkout@v4
        with:
          repository: masinlocandher-max/PCO
          ref: main
          path: pco-source

      - name: Verify source boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test "$(tr -d '\r\n' < pco-source/CNAME)" = 'francinemariebautista.com'
          test -f pco-source/index.html
          grep -q 'What brought you here?' pco-source/index.html
          grep -q 'STRATEGY · COMMUNICATION · CREATIVE DIRECTION' pco-source/index.html
          test ! -f pco-source/vercel.json
          test ! -d pco-source/.vercel
          test ! -f vercel.json
          test ! -d .vercel
          ! grep -R -n '/fmbnews' src wrangler.jsonc

      - name: Build PCO root Worker from canonical PCO checkout
        shell: bash
        run: |
          cat > pco-root-worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === '/news' || url.pathname.startsWith('/news/')) {
                return fetch(request);
              }
              let path = url.pathname;
              if (path === '/') path = '/index.html';
              url.pathname = path;
              const response = await env.ASSETS.fetch(new Request(url, request));
              const headers = new Headers(response.headers);
              headers.set('X-FMB-Root-Source', 'PCO');
              headers.set('X-FMB-Root-Repository', 'masinlocandher-max/PCO');
              return new Response(response.body, {
                status: response.status,
                statusText: response.statusText,
                headers,
              });
            }
          };
          EOF

          cat > pco-root-wrangler.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "fmb-pco-root",
            "main": "pco-root-worker.js",
            "compatibility_date": "2026-09-04",
            "workers_dev": true,
            "assets": {
              "directory": "./pco-source",
              "binding": "ASSETS",
              "run_worker_first": true,
              "html_handling": "none",
              "not_found_handling": "404-page"
            }
          }
          EOF

      - name: Deploy PCO root Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config pco-root-wrangler.jsonc

      - name: Attach apex and www as PCO Worker Custom Domains
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euxo pipefail
          account_id="${CLOUDFLARE_ACCOUNT_ID:-4821fa52e064d5aa269e76619559ec95}"
          zone_id='2e2210f55eba305e10b3f3f0f4a20261'
          api='https://api.cloudflare.com/client/v4'
          for hostname in francinemariebautista.com www.francinemariebautista.com; do
            payload="$(jq -nc --arg hostname "$hostname" --arg service 'fmb-pco-root' --arg zone_id "$zone_id" --arg zone_name 'francinemariebautista.com' '{hostname:$hostname,service:$service,zone_id:$zone_id,zone_name:$zone_name}')"
            response="$(curl --silent --show-error -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              "${api}/accounts/${account_id}/workers/domains" \
              --data "$payload")"
            echo "$response" | jq '{success,errors,messages,result:{hostname:.result.hostname,service:.result.service,zone_name:.result.zone_name}}'
            printf '%s' "$response" | jq -e '.success == true and .result.service == "fmb-pco-root"' >/dev/null
          done

      - name: Deploy canonical FMBNews /news route after root cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Verify live ownership split
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            rm -f /tmp/root.headers /tmp/root.html /tmp/news.headers /tmp/news.html
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' -D /tmp/root.headers \
              "https://francinemariebautista.com/?pco-custom-domain=${GITHUB_SHA}-${attempt}" \
              -o /tmp/root.html || true
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' -D /tmp/news.headers \
              "https://www.francinemariebautista.com/news/?pco-custom-domain=${GITHUB_SHA}-${attempt}" \
              -o /tmp/news.html || true

            root_ok=false
            news_ok=false
            if tr -d '\r' < /tmp/root.headers | grep -Eqi '^x-fmb-root-source: PCO$' \
              && grep -q 'What brought you here?' /tmp/root.html \
              && grep -q 'STRATEGY · COMMUNICATION · CREATIVE DIRECTION' /tmp/root.html \
              && ! grep -qi 'Official Ecosystem Bulletin' /tmp/root.html; then
              root_ok=true
            fi
            if tr -d '\r' < /tmp/news.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$' \
              && grep -qi 'FMB News' /tmp/news.html; then
              news_ok=true
            fi
            echo "ownership check ${attempt}: root=${root_ok} news=${news_ok}"
            if [ "$root_ok" = true ] && [ "$news_ok" = true ]; then
              echo 'OWNERSHIP VERIFIED: PCO owns root; FMBNews owns /news; Vercel/FMB-Ecosystem is bypassed.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Ownership split did not verify.'
          echo '--- root headers ---'; cat /tmp/root.headers || true
          echo '--- root excerpt ---'; head -c 1200 /tmp/root.html || true
          echo '--- news headers ---'; cat /tmp/news.headers || true
          echo '--- news excerpt ---'; head -c 1200 /tmp/news.html || true
          exit 1
