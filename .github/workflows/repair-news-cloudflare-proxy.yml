name: Repair FMB News Cloudflare proxy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-news-cloudflare-proxy.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair FMB News Cloudflare proxy'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ZONE_ID: 2e2210f55eba305e10b3f3f0f4a20261
      CLOUDFLARE_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Confirm Cloudflare token is configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not configured for this repository.'
            exit 1
          fi

      - name: Confirm Cloudflare zone is accessible
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          http_code="$(curl -sS -o /tmp/zone.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}" || true)"
          if [ "$http_code" != '200' ] || ! jq -e '.success == true' /tmp/zone.json >/dev/null 2>&1; then
            echo '::error::Cloudflare token cannot access the configured zone, or the zone ID is invalid.'
            exit 1
          fi
          test "$(jq -r '.result.name // empty' /tmp/zone.json)" = 'francinemariebautista.com'

      - name: Confirm public DNS delegates to this Cloudflare zone
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}" > /tmp/zone.json
          mapfile -t expected < <(jq -r '.result.name_servers[]?' /tmp/zone.json | tr '[:upper:]' '[:lower:]' | sed 's/\.$//' | sort -u)
          mapfile -t actual < <(dig +short NS francinemariebautista.com | tr '[:upper:]' '[:lower:]' | sed 's/\.$//' | sort -u)
          if [ "${#expected[@]}" -lt 2 ]; then
            echo '::error::Cloudflare zone did not return its assigned nameservers.'
            exit 1
          fi
          if [ "${#actual[@]}" -lt 2 ]; then
            echo '::error::Public DNS did not return a valid nameserver delegation.'
            exit 1
          fi
          printf '%s\n' "${expected[@]}" > /tmp/expected-ns
          printf '%s\n' "${actual[@]}" > /tmp/actual-ns
          if ! diff -u /tmp/expected-ns /tmp/actual-ns; then
            echo '::error::The domain is not delegated to the Cloudflare nameservers assigned to this zone. Cloudflare Worker routes cannot own /news until delegation is restored.'
            exit 1
          fi

      - name: Confirm apex DNS record exists in Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=francinemariebautista.com" > /tmp/dns.json
          jq -e '.success == true and ([.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME")] | length > 0)' /tmp/dns.json >/dev/null

      - name: Confirm www DNS record exists in Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=www.francinemariebautista.com" > /tmp/dns.json
          jq -e '.success == true and ([.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME")] | length > 0)' /tmp/dns.json >/dev/null

      - name: Enable Cloudflare proxy for canonical hostnames
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for hostname in www.francinemariebautista.com francinemariebautista.com; do
            response="$(curl --silent --show-error --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${hostname}")"
            echo "$response" | jq -c '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | {id,type,name,content,proxied}' | while read -r record; do
              id="$(echo "$record" | jq -r '.id')"
              proxied="$(echo "$record" | jq -r '.proxied')"
              if [ "$proxied" != 'true' ]; then
                patched="$(curl --silent --show-error --fail -X PATCH -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${id}" --data '{"proxied":true}')"
                echo "$patched" | jq -e '.success == true and .result.proxied == true' >/dev/null
              fi
            done
          done

      - name: Verify canonical FMB News routes reach Worker
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local url="$1" needle="$2"
            for attempt in $(seq 1 20); do
              rm -f /tmp/h /tmp/b
              status="$(curl -sS -o /tmp/b -D /tmp/h -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${url}?proxyfix=${GITHUB_SHA}-${attempt}" || true)"
              worker=false
              tr -d '\r' < /tmp/h | grep -Eqi '^x-fmb-news-worker: fmb-news$' && worker=true || true
              if [ "$status" = '200' ] && [ "$worker" = true ] && grep -qi "$needle" /tmp/b; then return 0; fi
              sleep 3
            done
            echo "::error::${url} still does not reach the FMB News Worker."
            return 1
          }
          check 'https://www.francinemariebautista.com/news/' 'FMB News'
          check 'https://www.francinemariebautista.com/news/world/' 'FMB Worldwide'
          check 'https://www.francinemariebautista.com/news/sara-duterte-arrest-warrant-grave-threats-september-4-2026/' 'QC Court Issues Arrest Warrant Against VP Sara Duterte'

# Trigger marker: 2026-09-05 identify authoritative DNS before repair.
