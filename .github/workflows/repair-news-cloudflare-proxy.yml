name: Repair FMB News Cloudflare proxy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-news-cloudflare-proxy.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair FMB News Cloudflare proxy'
    runs-on: ubuntu-latest
    env:
      ZONE_ID: 2e2210f55eba305e10b3f3f0f4a20261
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Check www DNS record is proxied
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${CF_API}/zones/${ZONE_ID}/dns_records?name=www.francinemariebautista.com" > /tmp/www.json
          jq -e '.result | any((.type == "CNAME" or .type == "A") and .proxied == true)' /tmp/www.json >/dev/null

      - name: Check exact www Worker route exists
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${CF_API}/zones/${ZONE_ID}/workers/routes" > /tmp/routes.json
          jq -e '.result | any(.script == "fmb-news" and .pattern == "www.francinemariebautista.com/news*")' /tmp/routes.json >/dev/null

      - name: Check exact apex Worker route exists
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${CF_API}/zones/${ZONE_ID}/workers/routes" > /tmp/routes.json
          jq -e '.result | any(.script == "fmb-news" and .pattern == "francinemariebautista.com/news*")' /tmp/routes.json >/dev/null

      - name: Check public www news returns HTTP 200
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/body -D /tmp/headers -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://www.francinemariebautista.com/news/?diag=${GITHUB_SHA}")"
          test "$code" = '200'

      - name: Check public www news has Worker header
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -o /tmp/body -D /tmp/headers --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://www.francinemariebautista.com/news/?diag=${GITHUB_SHA}"
          tr -d '\r' < /tmp/headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

      - name: Check public www news contains newsroom identity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -o /tmp/body --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://www.francinemariebautista.com/news/?diag=${GITHUB_SHA}"
          grep -Eqi 'FMB[[:space:]]*News|Filipino Media Bulletin' /tmp/body

      - name: Check apex news redirects to canonical www
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -I --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://francinemariebautista.com/news/?diag=${GITHUB_SHA}" > /tmp/apex.headers
          tr -d '\r' < /tmp/apex.headers | grep -Eq '^HTTP/[^ ]+ 308'
          tr -d '\r' < /tmp/apex.headers | grep -Eqi '^location: https://www\.francinemariebautista\.com/news/'

      - name: Diagnostic completion
        shell: bash
        run: echo 'FMB News route diagnostics completed.'

# Trigger marker: 2026-09-05 split live edge checks after successful Wrangler route deployment.
