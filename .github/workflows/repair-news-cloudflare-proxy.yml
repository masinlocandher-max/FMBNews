name: Repair FMB News Cloudflare proxy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-news-cloudflare-proxy.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair FMB News Cloudflare proxy'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ZONE_ID: 2e2210f55eba305e10b3f3f0f4a20261
      CLOUDFLARE_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Confirm Cloudflare token is configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Confirm Cloudflare zone and public delegation
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}" > /tmp/zone.json
          jq -e '.success == true and .result.name == "francinemariebautista.com"' /tmp/zone.json >/dev/null
          mapfile -t expected < <(jq -r '.result.name_servers[]?' /tmp/zone.json | tr '[:upper:]' '[:lower:]' | sed 's/\.$//' | sort -u)
          mapfile -t actual < <(dig +short NS francinemariebautista.com | tr '[:upper:]' '[:lower:]' | sed 's/\.$//' | sort -u)
          printf '%s\n' "${expected[@]}" > /tmp/expected-ns
          printf '%s\n' "${actual[@]}" > /tmp/actual-ns
          diff -u /tmp/expected-ns /tmp/actual-ns

      - name: Restore canonical apex records in Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          hostname='francinemariebautista.com'
          expected_ips=(185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153)

          current="$(curl -sS --fail "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${hostname}")"
          echo "$current" | jq -e '.success == true' >/dev/null

          # Remove conflicting address/alias records only when they are not one of the canonical GitHub Pages A records.
          echo "$current" | jq -c '.result[] | select(.type == "AAAA" or .type == "CNAME" or (.type == "A" and (.content | IN("185.199.108.153","185.199.109.153","185.199.110.153","185.199.111.153") | not))) | {id,type,content}' | while read -r record; do
            id="$(echo "$record" | jq -r '.id')"
            curl -sS --fail -X DELETE "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${id}" | jq -e '.success == true' >/dev/null
          done

          for ip in "${expected_ips[@]}"; do
            current="$(curl -sS --fail "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?type=A&name=${hostname}&content=${ip}")"
            id="$(echo "$current" | jq -r '.result[0].id // empty')"
            if [ -z "$id" ]; then
              payload="$(jq -nc --arg name "$hostname" --arg content "$ip" '{type:"A",name:$name,content:$content,ttl:1,proxied:true,comment:"PCO GitHub Pages canonical apex; FMB News edge enabled"}')"
              created="$(curl -sS --fail -X POST "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records" --data "$payload")"
              echo "$created" | jq -e '.success == true and .result.proxied == true' >/dev/null
            else
              payload="$(jq -nc '{proxied:true,ttl:1}')"
              patched="$(curl -sS --fail -X PATCH "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${id}" --data "$payload")"
              echo "$patched" | jq -e '.success == true and .result.proxied == true' >/dev/null
            fi
          done

      - name: Restore canonical www record in Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          hostname='www.francinemariebautista.com'
          target='masinlocandher-max.github.io'
          current="$(curl -sS --fail "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${hostname}")"
          echo "$current" | jq -e '.success == true' >/dev/null

          echo "$current" | jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' | while read -r id; do
            [ -n "$id" ] || continue
            curl -sS --fail -X DELETE "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${id}" | jq -e '.success == true' >/dev/null
          done

          payload="$(jq -nc --arg name "$hostname" --arg content "$target" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true,comment:"PCO GitHub Pages canonical www; FMB News edge enabled"}')"
          created="$(curl -sS --fail -X POST "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records" --data "$payload")"
          echo "$created" | jq -e '.success == true and .result.proxied == true' >/dev/null

      - name: Verify Cloudflare DNS records are canonical and proxied
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          apex="$(curl -sS --fail "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=francinemariebautista.com")"
          www="$(curl -sS --fail "${auth[@]}" "${CLOUDFLARE_API}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=www.francinemariebautista.com")"
          test "$(echo "$apex" | jq '[.result[] | select(.type == "A" and .proxied == true and (.content | IN("185.199.108.153","185.199.109.153","185.199.110.153","185.199.111.153")))] | length')" -eq 4
          echo "$www" | jq -e '.result | length == 1 and .[0].type == "CNAME" and .[0].content == "masinlocandher-max.github.io" and .[0].proxied == true' >/dev/null

      - name: Verify canonical FMB News routes reach Worker
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local url="$1" needle="$2"
            for attempt in $(seq 1 20); do
              rm -f /tmp/h /tmp/b
              status="$(curl -sS -o /tmp/b -D /tmp/h -w '%{http_code}' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${url}?proxyfix=${GITHUB_SHA}-${attempt}" || true)"
              worker=false
              tr -d '\r' < /tmp/h | grep -Eqi '^x-fmb-news-worker: fmb-news$' && worker=true || true
              echo "${url}: HTTP ${status}, worker=${worker}"
              if [ "$status" = '200' ] && [ "$worker" = true ] && grep -qi "$needle" /tmp/b; then return 0; fi
              sleep 3
            done
            echo "::error::${url} still does not reach the FMB News Worker."
            return 1
          }
          check 'https://www.francinemariebautista.com/news/' 'FMB News'
          check 'https://www.francinemariebautista.com/news/world/' 'FMB Worldwide'
          check 'https://www.francinemariebautista.com/news/sara-duterte-arrest-warrant-grave-threats-september-4-2026/' 'QC Court Issues Arrest Warrant Against VP Sara Duterte'

# Trigger marker: 2026-09-05 restore authoritative Cloudflare records and FMB News edge.
