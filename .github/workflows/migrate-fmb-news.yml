name: Sync FMB News from legacy FMB-Ecosystem

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FMBNews
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Check out legacy source FMB-Ecosystem
        uses: actions/checkout@v4
        with:
          repository: masinlocandher-max/FMB-Ecosystem
          ref: main
          path: source
          fetch-depth: 1

      - name: Copy canonical newsroom source of truth
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/apps/withlovefmb"
          DST="$GITHUB_WORKSPACE/target"

          rm -rf "$DST/site" "$DST/content/news" "$DST/public/assets/images/news" "$DST/public/assets/data/fmb-news-approved" "$DST/migration/legacy-news-scripts"
          mkdir -p "$DST/site" "$DST/content/news" "$DST/public/assets/css" "$DST/public/assets/js" "$DST/public/assets/images/news" "$DST/public/assets/data/fmb-news-approved" "$DST/migration/legacy-news-scripts"

          rsync -a "$SRC/news/" "$DST/site/"
          rsync -a "$SRC/content/news/" "$DST/content/news/"
          rsync -a "$SRC/assets/images/news/" "$DST/public/assets/images/news/"
          if [ -d "$SRC/assets/data/fmb-news-approved" ]; then rsync -a "$SRC/assets/data/fmb-news-approved/" "$DST/public/assets/data/fmb-news-approved/"; fi

          find "$SRC/assets/css" -maxdepth 1 -type f \( -name 'fmb-news*.css' -o -name 'fmbnews*.css' -o -name 'fmb-brief*.css' -o -name 'fmb-worldwide*.css' \) -print0 | while IFS= read -r -d '' file; do cp "$file" "$DST/public/assets/css/"; done
          find "$SRC/assets/js" -maxdepth 1 -type f \( -name 'fmb-news*.js' -o -name 'fmbnews*.js' -o -name 'fmb-brief*.js' -o -name 'fmb-worldwide*.js' \) -print0 | while IFS= read -r -d '' file; do cp "$file" "$DST/public/assets/js/"; done

          for file in fmb-unified-system.css fmb-sitewide-visual-fixes.css; do [ -f "$SRC/assets/css/$file" ] && cp "$SRC/assets/css/$file" "$DST/public/assets/css/$file"; done
          for file in fmb-unified-system.js; do [ -f "$SRC/assets/js/$file" ] && cp "$SRC/assets/js/$file" "$DST/public/assets/js/$file"; done
          if [ -d "$SRC/assets/images/fmbandco" ]; then mkdir -p "$DST/public/assets/images/fmbandco"; rsync -a "$SRC/assets/images/fmbandco/" "$DST/public/assets/images/fmbandco/"; fi

          find "$GITHUB_WORKSPACE/source/scripts" -maxdepth 1 -type f \( -iname '*fmb*news*.mjs' -o -iname '*fmbnews*.mjs' -o -iname '*fmb*brief*.mjs' -o -iname '*newsroom*.mjs' \) -print0 | while IFS= read -r -d '' file; do cp "$file" "$DST/migration/legacy-news-scripts/"; done

          SOURCE_SHA=$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)
          printf '%s\n' "$SOURCE_SHA" > "$DST/migration/source-ecosystem-commit.txt"

      - name: Verify and commit manual legacy sync
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          npm run build
          npm run verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site content public migration
          if git diff --cached --quiet; then
            echo "Legacy snapshot already current."
            exit 0
          fi
          git commit -m "Sync legacy FMB News snapshot"
          git push origin HEAD:main
