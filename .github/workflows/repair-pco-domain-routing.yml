name: Repair PCO root and FMB News route ownership

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-pco-domain-routing.yml'

permissions:
  contents: read

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair PCO root and FMB News route ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and verify canonical FMB News
        run: |
          set -euxo pipefail
          npm run build
          npm run verify
          ! grep -R -n '/fmbnews' src wrangler.jsonc
          ! grep -R -n -E 'masinlocandher-max/FMB-Ecosystem' src site public scripts package.json wrangler.jsonc

      - name: Deploy FMB News Worker for /news only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Point apex and www to PCO GitHub Pages origin
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euxo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          zone_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/zones?name=francinemariebautista.com&status=active")"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty')"
          test -n "$zone_id"

          for hostname in francinemariebautista.com www.francinemariebautista.com; do
            records="$(curl --fail --silent --show-error "${auth[@]}" "${api}/zones/${zone_id}/dns_records?name=${hostname}")"
            printf '%s' "$records" | jq -e '.success == true' >/dev/null
            printf '%s' "$records" | jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' | while IFS= read -r record_id; do
              test -n "$record_id"
              response="$(curl --fail --silent --show-error -X DELETE "${auth[@]}" "${api}/zones/${zone_id}/dns_records/${record_id}")"
              printf '%s' "$response" | jq -e '.success == true' >/dev/null
            done
          done

          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            response="$(curl --fail --silent --show-error -X POST "${auth[@]}" \
              "${api}/zones/${zone_id}/dns_records" \
              --data "$(jq -nc --arg name 'francinemariebautista.com' --arg content "$ip" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}')")"
            printf '%s' "$response" | jq -e '.success == true and .result.proxied == true' >/dev/null
          done

          response="$(curl --fail --silent --show-error -X POST "${auth[@]}" \
            "${api}/zones/${zone_id}/dns_records" \
            --data "$(jq -nc --arg name 'www.francinemariebautista.com' --arg content 'masinlocandher-max.github.io' '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')")"
          printf '%s' "$response" | jq -e '.success == true and .result.proxied == true' >/dev/null

          apex="$(curl --fail --silent --show-error "${auth[@]}" "${api}/zones/${zone_id}/dns_records?name=francinemariebautista.com")"
          www="$(curl --fail --silent --show-error "${auth[@]}" "${api}/zones/${zone_id}/dns_records?name=www.francinemariebautista.com")"
          printf '%s' "$apex" | jq -e '[.result[] | select(.type=="A" and (.content=="185.199.108.153" or .content=="185.199.109.153" or .content=="185.199.110.153" or .content=="185.199.111.153") and .proxied==true)] | length == 4' >/dev/null
          printf '%s' "$www" | jq -e '[.result[] | select(.type=="CNAME" and .content=="masinlocandher-max.github.io" and .proxied==true)] | length == 1' >/dev/null
          ! printf '%s\n%s' "$apex" "$www" | grep -Eqi 'vercel|76\.76\.21\.21|216\.198\.79\.1'

      - name: Verify PCO root and standalone FMB News live routing
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            rm -f /tmp/root.headers /tmp/root.html /tmp/news.headers /tmp/news.html
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/root.headers \
              "https://francinemariebautista.com/?pco-route-check=${GITHUB_SHA}-${attempt}" \
              -o /tmp/root.html || true
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/news.headers \
              "https://www.francinemariebautista.com/news/?news-route-check=${GITHUB_SHA}-${attempt}" \
              -o /tmp/news.html || true

            root_ok=false
            news_ok=false
            if grep -q 'What brought you here?' /tmp/root.html \
              && grep -q 'STRATEGY · COMMUNICATION · CREATIVE DIRECTION' /tmp/root.html \
              && ! grep -qi 'Official Ecosystem Bulletin' /tmp/root.html; then
              root_ok=true
            fi
            if tr -d '\r' < /tmp/news.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$' \
              && grep -qi 'FMB News' /tmp/news.html \
              && grep -qi 'FMB Worldwide' /tmp/news.html \
              && grep -qi 'FMB Explainer' /tmp/news.html \
              && grep -qi 'FMB Fact Check' /tmp/news.html \
              && grep -qi 'FMB Daily Brief' /tmp/news.html; then
              news_ok=true
            fi

            if [ "$root_ok" = true ] && [ "$news_ok" = true ]; then
              echo 'ROUTING REPAIRED: PCO owns the root; FMBNews owns /news.'
              exit 0
            fi
            echo "Waiting for routing propagation (${attempt}/30): root=${root_ok} news=${news_ok}"
            sleep 10
          done

          echo '::error::Canonical routing did not verify in time.'
          echo '--- root headers ---'; cat /tmp/root.headers || true
          echo '--- root body excerpt ---'; head -c 1000 /tmp/root.html || true
          echo '--- news headers ---'; cat /tmp/news.headers || true
          echo '--- news body excerpt ---'; head -c 1000 /tmp/news.html || true
          exit 1
