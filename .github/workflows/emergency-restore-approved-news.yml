name: Emergency restore approved FMB News

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-restore-approved-news.yml'

permissions:
  contents: read

jobs:
  restore:
    if: github.event.head_commit.message == 'Emergency restore approved FMB News production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build approved standalone newsroom
        run: npm run build
      - name: Verify approved standalone newsroom
        run: npm run verify
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Deploy approved FMB News to Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify standalone FMB News is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -D /tmp/fmb.headers \
              "https://www.francinemariebautista.com/news/?restore=${GITHUB_SHA}-${attempt}" \
              -o /tmp/fmb.html; then
              if grep -qi 'FMB News' /tmp/fmb.html \
                && grep -qi 'FMB Worldwide' /tmp/fmb.html \
                && grep -qi 'FMB Explainer' /tmp/fmb.html \
                && grep -qi 'FMB Fact Check' /tmp/fmb.html \
                && grep -qi 'FMB Daily Brief' /tmp/fmb.html \
                && tr -d '\r' < /tmp/fmb.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'; then
                echo 'Approved standalone FMB News is live.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::error::Approved standalone FMB News did not verify after deployment.'
          cat /tmp/fmb.headers || true
          exit 1
