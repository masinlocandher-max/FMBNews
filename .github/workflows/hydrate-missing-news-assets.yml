name: Hydrate missing FMB News assets

on:
  push:
    branches: [main]
    paths:
      - .hydrate-trigger

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FMBNews
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Check out FMB-Ecosystem source
        uses: actions/checkout@v4
        with:
          repository: masinlocandher-max/FMB-Ecosystem
          ref: main
          path: source
          fetch-depth: 1

      - name: Copy only referenced shared newsroom dependencies
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/source/apps/withlovefmb/assets"
          DST="$GITHUB_WORKSPACE/target/public/assets"

          files=(
            "css/amor-deloso-memorial.css"
            "css/fmb-content.css"
            "css/fmb-footer-v2.css"
            "css/fmb-polish.css"
            "css/news-channel.css"
            "css/site.css"
            "images/fmb-approved/fmb-master-purple-square.webp"
            "images/fmb-approved/fmb-news-official-transparent.webp"
            "images/icon-transparent.png"
            "images/projects/cognita-logo-clean.png"
            "images/projects/senz-logo-clean.png"
            "images/signature-transparent.png"
            "js/news-channel.js"
          )

          for rel in "${files[@]}"; do
            test -f "$SRC/$rel"
            mkdir -p "$(dirname "$DST/$rel")"
            cp -p "$SRC/$rel" "$DST/$rel"
          done

          cd "$GITHUB_WORKSPACE/target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          if git diff --cached --quiet; then
            echo "All shared newsroom dependencies were already present."
            exit 0
          fi
          git commit -m "Import shared assets required by migrated FMB News articles"
          git push origin HEAD:main
