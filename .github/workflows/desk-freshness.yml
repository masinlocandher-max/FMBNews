name: Desk freshness

# FMB Worldwide published daily from September 1 to September 4 2026, then
# stopped. Eleven days later Septembers 5 to 15 were committed in one batch of
# backfills. Throughout that blackout every gate in this repository was green,
# because publishing is entirely manual -- there was no cron anywhere in
# .github/workflows -- and nothing was watching the clock.
#
# verify-desk-freshness.mjs now fails the build when a desk goes past its
# declared cadence. That only helps when somebody runs a build. This runs the
# same check on a schedule and opens an issue, so the alarm reaches the newsroom
# on a quiet day, which is exactly the day it is needed.

on:
  schedule:
    # 09:00 Philippine Standard Time (UTC+8), daily.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: desk-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No npm ci: this build is dependency-free, and verify-standalone.yml runs
      # `npm run build` the same way. There is no package-lock.json, so npm ci
      # would fail outright.
      #
      # The freshness check reads dist/, so the site has to be built first.
      - name: Build
        run: npm run build

      - name: Check desk freshness
        id: freshness
        run: |
          set +e
          node scripts/verify-desk-freshness.mjs > freshness.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat freshness.txt
          set -e

      - name: Open or update the stale-desk issue
        if: steps.freshness.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('freshness.txt', 'utf8').slice(0, 5000);
            const title = 'FMB desks have stopped publishing';
            const body = [
              'The scheduled freshness check found at least one desk past its declared cadence.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              'The fix is to publish the missing editions. Do not raise `maxAgeDays` in',
              '`content/news/desk-freshness-policy.json` to clear this — that turns a newsroom',
              'that has gone quiet into a build that reports it has not.',
              '',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'desk-freshness',
            });

            if (existing.data.length) {
              // Update in place rather than filing a new issue every morning.
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.notice(`Updated existing stale-desk issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['desk-freshness'],
              });
              core.notice(`Opened stale-desk issue #${created.data.number}`);
            }

      - name: Close the stale-desk issue once the desks are current
        if: steps.freshness.outputs.status == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'desk-freshness',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All FMB desks are publishing within their declared cadence again. Closing.\n\n_Generated by [Claude Code](https://claude.ai/code)_',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail the run when a desk is stale
        if: steps.freshness.outputs.status != '0'
        run: exit 1
