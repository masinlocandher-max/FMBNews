name: Repair FMB News /news route ownership

# WHY THIS EXISTS
#
# /news is 404ing in production and every deploy fails its post-deploy cutover
# check. The cause is not in this repository's code.
#
# pco-custom-domain-cutover.yml attached BOTH francinemariebautista.com and
# www.francinemariebautista.com to the Worker service `fmb-pco-root` as
# Cloudflare **Custom Domains**.
#
# A Custom Domain claims the ENTIRE hostname. It takes precedence over Worker
# Routes, so once www.francinemariebautista.com became a Custom Domain for
# fmb-pco-root, every request to that host — /news/* included — goes to
# fmb-pco-root. The fmb-news routes in wrangler.jsonc
# ("www.francinemariebautista.com/news*") never fire, and fmb-pco-root has no
# /news, so it returns 404.
#
# THE FIX
#
# Serve the PCO root through a Worker **Route** instead of a Custom Domain.
# Routes coexist on one hostname and Cloudflare dispatches to the MOST SPECIFIC
# match, so:
#
#   www.francinemariebautista.com/news*  -> fmb-news      (more specific, wins)
#   www.francinemariebautista.com/*      -> fmb-pco-root  (everything else)
#
# Run with mode=diagnose first (the default). It changes nothing and prints who
# currently owns each hostname. Run again with mode=apply to perform the repair.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose (read-only) or apply (perform the repair)'
        required: true
        default: diagnose
        type: choice
        options: [diagnose, apply]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_ID: 2e2210f55eba305e10b3f3f0f4a20261
      ZONE_NAME: francinemariebautista.com
      NEWS_SERVICE: fmb-news
      ROOT_SERVICE: fmb-pco-root
    steps:
      - name: Check credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Show who owns the hostnames today
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          echo '--- Worker Custom Domains on this zone (these claim the WHOLE hostname) ---'
          curl -sS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?zone_id=${ZONE_ID}" \
            | jq '[.result[] | {id, hostname, service, environment}]'

          echo '--- Worker Routes on this zone (these are path-scoped, most specific wins) ---'
          curl -sS "${auth[@]}" "${api}/zones/${ZONE_ID}/workers/routes" \
            | jq '[.result[] | {id, pattern, script}]'

          echo '--- Live status right now ---'
          for u in "https://www.${ZONE_NAME}/" "https://www.${ZONE_NAME}/news/"; do
            printf '%s -> %s\n' "$u" "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo unreachable)"
          done

      - name: Repair route ownership
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          # 1. Drop the Custom Domains that are swallowing the whole hostname.
          #    Only those bound to the PCO root are removed; anything else is left alone.
          domains="$(curl -sS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?zone_id=${ZONE_ID}")"
          for host in "${ZONE_NAME}" "www.${ZONE_NAME}"; do
            id="$(echo "$domains" | jq -r --arg h "$host" --arg s "$ROOT_SERVICE" \
              '.result[] | select(.hostname==$h and .service==$s) | .id // empty')"
            if [ -n "$id" ]; then
              echo "Removing Custom Domain ${host} -> ${ROOT_SERVICE} (${id})"
              curl -sS -X DELETE "${auth[@]}" \
                "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains/${id}" | jq '{success,errors}'
            else
              echo "No Custom Domain for ${host} -> ${ROOT_SERVICE}; nothing to remove."
            fi
          done

          # 2. Give the PCO root a catch-all Route so it still serves everything
          #    that is not /news. Cloudflare prefers the more specific /news* route.
          for pattern in "${ZONE_NAME}/*" "www.${ZONE_NAME}/*"; do
            echo "Ensuring Route ${pattern} -> ${ROOT_SERVICE}"
            curl -sS -X POST "${auth[@]}" "${api}/zones/${ZONE_ID}/workers/routes" \
              --data "$(jq -nc --arg p "$pattern" --arg s "$ROOT_SERVICE" '{pattern:$p,script:$s}')" \
              | jq '{success,errors,result}'
          done

      - name: Verify /news is reachable again
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          # Cloudflare route changes propagate within seconds, but allow for it.
          for attempt in 1 2 3 4 5 6 7 8; do
            news="$(curl -sS -o /tmp/news.html -w '%{http_code}' --max-time 20 "https://www.${ZONE_NAME}/news/" || echo 000)"
            root="$(curl -sS -o /dev/null  -w '%{http_code}' --max-time 20 "https://www.${ZONE_NAME}/" || echo 000)"
            echo "attempt ${attempt}: /news/ -> ${news}, / -> ${root}"
            if [ "$news" = '200' ] && [ "$root" = '200' ]; then
              grep -qi 'Filipino Media Bulletin' /tmp/news.html || { echo '::error::/news/ served 200 but is not FMB News'; exit 1; }
              worker="$(curl -sS -D - -o /dev/null --max-time 20 "https://www.${ZONE_NAME}/news/" | tr -d '\r' | grep -i '^x-fmb-news-worker:' || true)"
              test -n "$worker" || { echo '::error::/news/ is not being served by the FMB News Worker'; exit 1; }
              echo "FMB News is reachable at https://www.${ZONE_NAME}/news/ and the PCO root still serves /"
              exit 0
            fi
            sleep 10
          done
          echo '::error::/news/ did not recover. Check the diagnose output above for competing hostname ownership.'
          exit 1
