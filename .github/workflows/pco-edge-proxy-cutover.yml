name: Emergency PCO edge cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pco-edge-proxy-cutover.yml'

permissions:
  contents: read

jobs:
  cutover:
    if: github.event.head_commit.message == 'Emergency PCO edge cutover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce canonical repository boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test ! -f vercel.json
          test ! -d .vercel
          ! grep -R -n '/fmbnews' src wrangler.jsonc
          grep -q 'www.francinemariebautista.com/news\*' wrangler.jsonc
          grep -q 'francinemariebautista.com/news\*' wrangler.jsonc

      - name: Confirm Cloudflare credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }

      - name: Proxy existing PCO DNS records through Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_id='2e2210f55eba305e10b3f3f0f4a20261'
          api='https://api.cloudflare.com/client/v4'

          for hostname in francinemariebautista.com www.francinemariebautista.com; do
            records="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --get --data-urlencode "name=${hostname}" \
              "${api}/zones/${zone_id}/dns_records")"

            printf '%s' "$records" | jq -e '.success == true' >/dev/null
            mapfile -t record_ids < <(printf '%s' "$records" | jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id')

            if [ "${#record_ids[@]}" -eq 0 ]; then
              echo "::error::No existing A/AAAA/CNAME DNS records found for ${hostname}; refusing to invent or replace DNS targets."
              exit 1
            fi

            echo "Found ${#record_ids[@]} existing origin record(s) for ${hostname}; preserving targets and enabling Cloudflare proxy only."

            for record_id in "${record_ids[@]}"; do
              response="$(curl --fail-with-body --silent --show-error -X PATCH \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                "${api}/zones/${zone_id}/dns_records/${record_id}" \
                --data '{"proxied":true}')"
              printf '%s' "$response" | jq -e '.success == true and .result.proxied == true' >/dev/null
              printf '%s' "$response" | jq '{success,result:{name:.result.name,type:.result.type,proxied:.result.proxied}}'
            done
          done

      - name: Verify PCO root and FMBNews /news routing
        shell: bash
        run: |
          set -euo pipefail
          article='https://www.francinemariebautista.com/news/sara-duterte-arrest-warrant-grave-threats-september-4-2026/'

          for attempt in $(seq 1 20); do
            rm -f /tmp/root.h /tmp/root.html /tmp/news.h /tmp/news.html /tmp/article.h /tmp/article.html

            curl -sSLo /tmp/root.html -D /tmp/root.h -L --max-time 30 -H 'Cache-Control: no-cache' \
              "https://francinemariebautista.com/?cutover=${GITHUB_SHA}-${attempt}" || true
            curl -sSLo /tmp/news.html -D /tmp/news.h -L --max-time 30 -H 'Cache-Control: no-cache' \
              "https://www.francinemariebautista.com/news/?cutover=${GITHUB_SHA}-${attempt}" || true
            curl -sSLo /tmp/article.html -D /tmp/article.h -L --max-time 30 -H 'Cache-Control: no-cache' \
              "${article}?cutover=${GITHUB_SHA}-${attempt}" || true

            root=false; news=false; breaking=false
            grep -q 'What brought you here?' /tmp/root.html && root=true || true
            tr -d '\r' < /tmp/news.h | grep -Eqi '^x-fmb-news-worker: fmb-news$' && grep -qi 'FMB News' /tmp/news.html && news=true || true
            tr -d '\r' < /tmp/article.h | grep -Eqi '^x-fmb-news-worker: fmb-news$' && grep -qi 'QC Court Issues Arrest Warrant Against VP Sara Duterte' /tmp/article.html && breaking=true || true

            echo "check ${attempt}: PCO-root=${root} FMBNews-home=${news} breaking-article=${breaking}"
            if [ "$root" = true ] && [ "$news" = true ] && [ "$breaking" = true ]; then
              echo 'RESOLVED: PCO remains the root origin; FMBNews owns /news through Cloudflare; Vercel/FMB-Ecosystem is not used.'
              exit 0
            fi
            sleep 4
          done

          echo '::error::Public routing did not converge after Cloudflare proxy activation.'
          echo 'ROOT HEADERS'; cat /tmp/root.h || true
          echo 'NEWS HEADERS'; cat /tmp/news.h || true
          echo 'ARTICLE HEADERS'; cat /tmp/article.h || true
          exit 1

# Trigger marker: 2026-09-05 14:35 Asia/Manila emergency /news recovery.
