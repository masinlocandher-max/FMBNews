name: Emergency PCO edge cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pco-edge-proxy-cutover.yml'

permissions:
  contents: read

jobs:
  cutover:
    if: github.event.head_commit.message == 'Emergency PCO edge cutover' || github.event.head_commit.message == 'Diagnose FMB DNS delegation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce canonical repository boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test ! -f vercel.json
          test ! -d .vercel
          ! grep -R -n '/fmbnews' src wrangler.jsonc
          grep -q 'www.francinemariebautista.com/news\*' wrangler.jsonc
          grep -q 'francinemariebautista.com/news\*' wrangler.jsonc

      - name: Confirm Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_DNS_TOKEN:-}" || { echo '::error::Missing CLOUDFLARE_DNS_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }

      - name: Diagnose authoritative DNS delegation
        shell: bash
        env:
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: |
          set -euo pipefail
          zone_id='2e2210f55eba305e10b3f3f0f4a20261'
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_DNS_TOKEN}" -H 'Content-Type: application/json')

          echo '=== CLOUDFLARE ZONE ==='
          zone="$(curl --fail-with-body -sS "${auth[@]}" "${api}/zones/${zone_id}")"
          printf '%s' "$zone" | jq '{success,result:{name,status,paused,type,name_servers,original_name_servers,original_registrar}}'

          echo '=== PUBLIC NS VIA GOOGLE DNS ==='
          curl --fail-with-body -sS 'https://dns.google/resolve?name=francinemariebautista.com&type=NS' | jq '{Status,Answer}'

          echo '=== PUBLIC A VIA GOOGLE DNS ==='
          curl --fail-with-body -sS 'https://dns.google/resolve?name=francinemariebautista.com&type=A' | jq '{Status,Answer}'

          echo '=== PUBLIC WWW VIA GOOGLE DNS ==='
          curl --fail-with-body -sS 'https://dns.google/resolve?name=www.francinemariebautista.com&type=CNAME' | jq '{Status,Answer}'

          echo '=== PUBLIC HEADERS ==='
          for url in https://francinemariebautista.com/ https://www.francinemariebautista.com/ https://www.francinemariebautista.com/news/; do
            echo "--- ${url}"
            curl -sS -I -L --max-time 20 "$url" | tr -d '\r' | grep -Ei '^(HTTP/|server:|location:|cf-ray:|x-vercel-|x-fmb-news-worker:)' || true
          done

      - name: Set canonical PCO DNS through Cloudflare
        if: github.event.head_commit.message == 'Emergency PCO edge cutover'
        shell: bash
        env:
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: |
          set -euo pipefail
          zone_id='2e2210f55eba305e10b3f3f0f4a20261'
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_DNS_TOKEN}" -H 'Content-Type: application/json')

          for hostname in francinemariebautista.com www.francinemariebautista.com; do
            records="$(curl --fail-with-body -sS "${auth[@]}" --get --data-urlencode "name=${hostname}" "${api}/zones/${zone_id}/dns_records")"
            printf '%s' "$records" | jq -e '.success == true' >/dev/null
            printf '%s' "$records" | jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' | while read -r record_id; do
              [ -n "$record_id" ] || continue
              curl --fail-with-body -sS -X DELETE "${auth[@]}" "${api}/zones/${zone_id}/dns_records/${record_id}" >/dev/null
              echo "Removed conflicting origin record ${record_id} for ${hostname}."
            done
          done

          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            payload="$(jq -nc --arg name 'francinemariebautista.com' --arg content "$ip" '{type:"A",name:$name,content:$content,ttl:1,proxied:true,comment:"PCO GitHub Pages canonical apex"}')"
            response="$(curl --fail-with-body -sS -X POST "${auth[@]}" "${api}/zones/${zone_id}/dns_records" --data "$payload")"
            printf '%s' "$response" | jq -e '.success == true and .result.proxied == true' >/dev/null
            echo "Added proxied GitHub Pages apex A ${ip}."
          done

          payload="$(jq -nc --arg name 'www.francinemariebautista.com' --arg content 'masinlocandher-max.github.io' '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true,comment:"PCO GitHub Pages canonical www"}')"
          response="$(curl --fail-with-body -sS -X POST "${auth[@]}" "${api}/zones/${zone_id}/dns_records" --data "$payload")"
          printf '%s' "$response" | jq -e '.success == true and .result.proxied == true' >/dev/null
          echo 'Added proxied GitHub Pages www CNAME.'

      - name: Verify Cloudflare DNS and Worker routes
        if: github.event.head_commit.message == 'Emergency PCO edge cutover'
        shell: bash
        env:
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_id='2e2210f55eba305e10b3f3f0f4a20261'
          api='https://api.cloudflare.com/client/v4'
          dns_auth=(-H "Authorization: Bearer ${CLOUDFLARE_DNS_TOKEN}" -H 'Content-Type: application/json')
          worker_auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          apex="$(curl --fail-with-body -sS "${dns_auth[@]}" --get --data-urlencode 'name=francinemariebautista.com' "${api}/zones/${zone_id}/dns_records")"
          www="$(curl --fail-with-body -sS "${dns_auth[@]}" --get --data-urlencode 'name=www.francinemariebautista.com' "${api}/zones/${zone_id}/dns_records")"
          routes="$(curl --fail-with-body -sS "${worker_auth[@]}" "${api}/zones/${zone_id}/workers/routes")"

          printf '%s' "$apex" | jq -e '[.result[] | select(.type=="A" and .proxied==true and (.content=="185.199.108.153" or .content=="185.199.109.153" or .content=="185.199.110.153" or .content=="185.199.111.153"))] | length == 4' >/dev/null
          printf '%s' "$www" | jq -e '[.result[] | select(.type=="CNAME" and .proxied==true and .content=="masinlocandher-max.github.io")] | length == 1' >/dev/null
          printf '%s' "$routes" | jq -e '.result | any(.script=="fmb-news" and .pattern=="www.francinemariebautista.com/news*")' >/dev/null
          printf '%s' "$routes" | jq -e '.result | any(.script=="fmb-news" and .pattern=="francinemariebautista.com/news*")' >/dev/null
          echo 'Cloudflare DNS and FMB News Worker routes verified.'

      - name: Verify public PCO root and FMB News route
        if: github.event.head_commit.message == 'Emergency PCO edge cutover'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            rm -f /tmp/root.h /tmp/root.html /tmp/www.h /tmp/www.html /tmp/news.h /tmp/news.html
            root_code="$(curl -sS -o /tmp/root.html -D /tmp/root.h -w '%{http_code}' -L --max-time 30 -H 'Cache-Control: no-cache' "https://francinemariebautista.com/?cutover=${GITHUB_SHA}-${attempt}" || true)"
            www_code="$(curl -sS -o /tmp/www.html -D /tmp/www.h -w '%{http_code}' -L --max-time 30 -H 'Cache-Control: no-cache' "https://www.francinemariebautista.com/?cutover=${GITHUB_SHA}-${attempt}" || true)"
            news_code="$(curl -sS -o /tmp/news.html -D /tmp/news.h -w '%{http_code}' -L --max-time 30 -H 'Cache-Control: no-cache' "https://www.francinemariebautista.com/news/?cutover=${GITHUB_SHA}-${attempt}" || true)"

            root=false; www=false; news=false
            [ "$root_code" = '200' ] && grep -qi 'Francine' /tmp/root.html && root=true || true
            [ "$www_code" = '200' ] && grep -qi 'Francine' /tmp/www.html && www=true || true
            [ "$news_code" = '200' ] && grep -qi 'FMB News' /tmp/news.html && tr -d '\r' < /tmp/news.h | grep -Eqi '^x-fmb-news-worker: fmb-news$' && news=true || true

            echo "check ${attempt}: apex=${root_code}/${root} www=${www_code}/${www} news=${news_code}/${news}"
            if [ "$root" = true ] && [ "$www" = true ] && [ "$news" = true ]; then
              echo 'RESOLVED: Cloudflare proxies PCO GitHub Pages at root and FMBNews owns /news.'
              exit 0
            fi
            sleep 4
          done

          echo '::error::Public Cloudflare routing did not converge.'
          echo 'APEX HEADERS'; cat /tmp/root.h || true
          echo 'WWW HEADERS'; cat /tmp/www.h || true
          echo 'NEWS HEADERS'; cat /tmp/news.h || true
          exit 1

# Trigger marker: 2026-09-07 diagnose authoritative DNS delegation.
