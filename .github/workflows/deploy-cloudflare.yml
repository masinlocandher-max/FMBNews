name: Deploy FMB News to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone newsroom
        run: npm run build
      - name: Verify standalone newsroom
        run: npm run verify
      - name: Install mobile browser QA runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/fmb-news-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent 'http://127.0.0.1:4173/news/' >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              cat /tmp/fmb-news-qa-server.log
              exit 1
            fi
            sleep 1
          done
          FMB_QA_BASE_URL='http://127.0.0.1:4173' node scripts/browser-qa.mjs
          FMB_QA_BASE_URL='http://127.0.0.1:4173' node scripts/browser-qa-crossword-ux.mjs
          FMB_QA_BASE_URL='http://127.0.0.1:4173' node scripts/browser-qa-home-motion.mjs
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - name: Deploy Worker and /news routes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify public /news cutover
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            local headers="$3"
            local label="$4"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --location --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                -D "$headers" \
                "${url}?cutover=${GITHUB_SHA}-${attempt}" -o "$output"; then
                echo "${label}: reachable on attempt ${attempt}"
                return 0
              fi
              echo "${label}: attempt ${attempt} failed; retrying in 5s"
              sleep 5
            done
            echo "::error::${label} did not become reachable after deployment"
            return 1
          }

          fetch_with_retry 'https://www.francinemariebautista.com/news/' /tmp/news-home.html /tmp/news-home.headers 'FMB News'
          cat /tmp/news-home.headers
          grep -qi 'FMB News' /tmp/news-home.html
          grep -qi 'FMB Worldwide' /tmp/news-home.html
          grep -qi 'FMB Daily Brief' /tmp/news-home.html
          grep -qi 'Filipino Media Bulletin' /tmp/news-home.html
          grep -qi 'type="application/rss+xml"' /tmp/news-home.html
          grep -qi 'href="/news/feed.xml"' /tmp/news-home.html
          if ! tr -d '\r' < /tmp/news-home.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'; then
            echo '::error::Public /news traffic is not reaching the FMBNews Cloudflare Worker. Ensure the www DNS record is Proxied (orange cloud) in Cloudflare.'
            exit 1
          fi
          echo 'FMB News home is confirmed on the FMBNews Worker.'

          fetch_with_retry 'https://www.francinemariebautista.com/news/sitemap.xml' /tmp/news-sitemap.xml /tmp/news-sitemap.headers 'FMB News sitemap'
          grep -q 'xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"' /tmp/news-sitemap.xml
          grep -q 'https://www.francinemariebautista.com/news/' /tmp/news-sitemap.xml
          tr -d '\r' < /tmp/news-sitemap.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          fetch_with_retry 'https://www.francinemariebautista.com/news/news-sitemap.xml' /tmp/google-news-sitemap.xml /tmp/google-news-sitemap.headers 'Google News sitemap'
          grep -q 'xmlns:news="http://www.google.com/schemas/sitemap-news/0.9"' /tmp/google-news-sitemap.xml
          tr -d '\r' < /tmp/google-news-sitemap.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          fetch_with_retry 'https://www.francinemariebautista.com/news/feed.xml' /tmp/news-feed.xml /tmp/news-feed.headers 'FMB News RSS feed'
          grep -q '<rss version="2.0"' /tmp/news-feed.xml
          grep -q '<title>FMB News</title>' /tmp/news-feed.xml
          grep -q 'https://www.francinemariebautista.com/news/feed.xml' /tmp/news-feed.xml
          tr -d '\r' < /tmp/news-feed.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          fetch_with_retry 'https://www.francinemariebautista.com/news/world/' /tmp/news-world.html /tmp/news-world.headers 'FMB Worldwide'
          grep -qi 'aria-label="FMB Worldwide"' /tmp/news-world.html
          grep -qi 'Filipino Media Bulletin' /tmp/news-world.html
          tr -d '\r' < /tmp/news-world.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          fetch_with_retry 'https://www.francinemariebautista.com/news/fmb-brief/' /tmp/news-brief.html /tmp/news-brief.headers 'FMB Daily Brief'
          grep -qi 'aria-label="FMB Daily Brief"' /tmp/news-brief.html
          grep -qi 'Daily Newsletter' /tmp/news-brief.html
          grep -qi 'Filipino Media Bulletin' /tmp/news-brief.html
          tr -d '\r' < /tmp/news-brief.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          fetch_with_retry 'https://www.francinemariebautista.com/news/explainer/' /tmp/news-explainer.html /tmp/news-explainer.headers 'FMB Explainer'
          grep -qi 'FMB Explainer' /tmp/news-explainer.html
          grep -qi 'fmbExplainedSearch' /tmp/news-explainer.html
          tr -d '\r' < /tmp/news-explainer.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          fetch_with_retry 'https://www.francinemariebautista.com/news/explainer/leptospirosis-after-flood-resilience-metro-manila/' /tmp/news-explainer-first.html /tmp/news-explainer-first.headers 'FMB Explainer article 001'
          grep -qi 'Leptospirosis After the Flood' /tmp/news-explainer-first.html
          grep -qi 'Sources' /tmp/news-explainer-first.html
          tr -d '\r' < /tmp/news-explainer-first.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          fetch_with_retry 'https://www.francinemariebautista.com/news/explainer/bakit-humihina-ang-halaga-ng-peso-laban-sa-dolyar/' /tmp/news-explainer-last.html /tmp/news-explainer-last.headers 'FMB Explainer article 206'
          grep -qi 'Bakit humihina ang halaga ng peso laban sa dolyar' /tmp/news-explainer-last.html
          grep -qi 'Sources' /tmp/news-explainer-last.html
          tr -d '\r' < /tmp/news-explainer-last.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          fetch_with_retry 'https://www.francinemariebautista.com/news/world/live/' /tmp/news-world-live.html /tmp/news-world-live.headers 'FMB Worldwide live desk'
          grep -qi 'aria-label="FMB Worldwide"' /tmp/news-world-live.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/fmb-brief/live/' /tmp/news-brief-live.html /tmp/news-brief-live.headers 'FMB Daily Brief live edition'
          grep -qi 'aria-label="FMB Daily Brief"' /tmp/news-brief-live.html
          grep -qi 'Daily Newsletter' /tmp/news-brief-live.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/assets/css/fmb-news-final.css' /tmp/news.css /tmp/news-css.headers 'News scoped CSS'
          test -s /tmp/news.css
          tr -d '\r' < /tmp/news-css.headers | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 'https://www.francinemariebautista.com/')"
          test "$status" = '200'
          echo "Main site root remains reachable: HTTP ${status}"

          headers="$(curl --silent --show-error --head --connect-timeout 10 --max-time 30 'https://francinemariebautista.com/news/' | tr -d '\r')"
          echo "$headers"
          echo "$headers" | grep -Eq '^HTTP/[^ ]+ 30[178]'
          echo "$headers" | grep -Eqi '^location: https://www\.francinemariebautista\.com/news/?'

          legacy_headers="$(curl --silent --show-error --head --connect-timeout 10 --max-time 30 'https://www.francinemariebautista.com/fmbnews/' | tr -d '\r')"
          echo "$legacy_headers"
          echo "$legacy_headers" | grep -Eq '^HTTP/[^ ]+ 30[178]'
          echo "$legacy_headers" | grep -Eqi '^location: https://www\.francinemariebautista\.com/news/'
          echo "$legacy_headers" | grep -Eqi '^x-fmb-news-worker: fmb-news$'

          echo 'Public FMB News network cutover, discovery feeds, FMB Explainer endpoints, and legacy-route ownership verified.'
