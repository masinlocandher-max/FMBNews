name: Deploy FMB News to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone newsroom
        run: npm run build
      - name: Verify standalone newsroom
        run: npm run verify
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - name: Deploy Worker and /news routes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify public /news cutover
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            local label="$3"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --location --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "${url}?cutover=${GITHUB_SHA}-${attempt}" -o "$output"; then
                echo "${label}: reachable on attempt ${attempt}"
                return 0
              fi
              echo "${label}: attempt ${attempt} failed; retrying in 5s"
              sleep 5
            done
            echo "::error::${label} did not become reachable after deployment"
            return 1
          }

          fetch_with_retry 'https://www.francinemariebautista.com/news/' /tmp/news-home.html 'News home'
          grep -qi 'FMB News' /tmp/news-home.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/world/' /tmp/news-world.html 'FMB Worldwide'
          grep -qi 'FMB Worldwide' /tmp/news-world.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/fmb-brief/' /tmp/news-brief.html 'FMB Brief'
          grep -qi 'FMB Brief' /tmp/news-brief.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/world/live/' /tmp/news-world-live.html 'Worldwide live desk'
          grep -qi 'FMB Worldwide' /tmp/news-world-live.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/fmb-brief/live/' /tmp/news-brief-live.html 'Brief live edition'
          grep -qi 'FMB Brief' /tmp/news-brief-live.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/assets/css/fmb-news-final.css' /tmp/news.css 'News scoped CSS'
          test -s /tmp/news.css

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 'https://www.francinemariebautista.com/')"
          test "$status" = '200'
          echo "Main site root remains reachable: HTTP ${status}"

          headers="$(curl --silent --show-error --head --connect-timeout 10 --max-time 30 'https://francinemariebautista.com/news/' | tr -d '\r')"
          echo "$headers"
          echo "$headers" | grep -Eq '^HTTP/[^ ]+ 30[178]'
          echo "$headers" | grep -Eqi '^location: https://www\.francinemariebautista\.com/news/?'

          echo 'Public FMB News cutover verified.'
