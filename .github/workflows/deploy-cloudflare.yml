name: Deploy FMB News to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build standalone newsroom
        run: npm run build

      - name: Verify standalone newsroom
        run: npm run verify

      - name: Install browser QA runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Gate deployment on complete browser QA
        run: npm run test:mobile:browser

      - name: Resolve Cloudflare account from canonical zone
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN'; exit 1; }
          zone='2e2210f55eba305e10b3f3f0f4a20261'
          response="$(curl -sS --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/zones/${zone}")"
          echo "$response" | jq -e '.success == true and .result.name == "francinemariebautista.com"' >/dev/null
          account_id="$(echo "$response" | jq -r '.result.account.id // empty')"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "$GITHUB_ENV"

      - name: Deploy Worker and /news routes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      - name: Remove obsolete /fmbnews route aliases
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone='2e2210f55eba305e10b3f3f0f4a20261'
          api="https://api.cloudflare.com/client/v4/zones/${zone}/workers/routes"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")

          routes="$(curl -sS --fail "${auth[@]}" "$api")"
          echo "$routes" | jq -e '.success == true' >/dev/null

          mapfile -t stale_ids < <(
            echo "$routes" | jq -r '.result[] | select(.pattern == "francinemariebautista.com/fmbnews*" or .pattern == "www.francinemariebautista.com/fmbnews*") | .id'
          )

          for route_id in "${stale_ids[@]}"; do
            echo "Deleting obsolete FMB News route ${route_id}"
            deleted="$(curl -sS --fail -X DELETE "${auth[@]}" "${api}/${route_id}")"
            echo "$deleted" | jq -e '.success == true' >/dev/null
          done

          remaining="$(curl -sS --fail "${auth[@]}" "$api")"
          echo "$remaining" | jq -e '.success == true' >/dev/null
          stale_count="$(echo "$remaining" | jq '[.result[] | select(.pattern == "francinemariebautista.com/fmbnews*" or .pattern == "www.francinemariebautista.com/fmbnews*")] | length')"
          test "$stale_count" = '0' || { echo '::error::Obsolete /fmbnews Worker routes still exist'; exit 1; }

          canonical_count="$(echo "$remaining" | jq '[.result[] | select(.pattern == "francinemariebautista.com/news*" or .pattern == "www.francinemariebautista.com/news*") | select(.script == "fmb-news")] | length')"
          test "$canonical_count" = '2' || { echo "::error::Expected two canonical /news routes bound to fmb-news; found ${canonical_count}"; exit 1; }
          echo 'Legacy /fmbnews aliases removed; canonical /news routes are the only FMB News Worker routes.'

      - name: Verify public /news cutover
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1" output="$2" headers="$3" label="$4"
            for attempt in $(seq 1 20); do
              if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' -D "$headers" \
                "${url}?cutover=${GITHUB_SHA}-${attempt}" -o "$output"; then
                if tr -d '\r' < "$headers" | grep -Eqi '^x-fmb-news-worker: fmb-news$'; then
                  echo "${label}: Worker verified on attempt ${attempt}"
                  return 0
                fi
              fi
              echo "${label}: attempt ${attempt} not on Worker yet; retrying in 5s"
              sleep 5
            done
            echo "::error::${label} did not become reachable on the FMBNews Worker after deployment"
            cat "$headers" || true
            return 1
          }

          fetch_with_retry 'https://www.francinemariebautista.com/news/' /tmp/news-home.html /tmp/news-home.headers 'FMB News'
          grep -Eqi 'FMB[[:space:]]*News|Filipino Media Bulletin' /tmp/news-home.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/sitemap.xml' /tmp/news-sitemap.xml /tmp/news-sitemap.headers 'FMB News sitemap'
          grep -q 'xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"' /tmp/news-sitemap.xml
          grep -q 'https://www.francinemariebautista.com/news/' /tmp/news-sitemap.xml
          grep -q 'https://www.francinemariebautista.com/news/philippines-womens-soft-tennis-first-asian-games-medal-september-19-2026/' /tmp/news-sitemap.xml

          fetch_with_retry 'https://www.francinemariebautista.com/news/news-sitemap.xml' /tmp/google-news-sitemap.xml /tmp/google-news-sitemap.headers 'Google News sitemap'
          grep -q 'xmlns:news="http://www.google.com/schemas/sitemap-news/0.9"' /tmp/google-news-sitemap.xml
          grep -q 'Generated from live FMB News CMS' /tmp/google-news-sitemap.xml

          fetch_with_retry 'https://www.francinemariebautista.com/news/feed.xml' /tmp/news-feed.xml /tmp/news-feed.headers 'FMB News RSS feed'
          grep -q '<rss version="2.0"' /tmp/news-feed.xml
          grep -q '<title>FMB News</title>' /tmp/news-feed.xml
          grep -q '<generator>FMB News live CMS</generator>' /tmp/news-feed.xml

          fetch_with_retry 'https://www.francinemariebautista.com/news/world/' /tmp/news-world.html /tmp/news-world.headers 'FMB Worldwide'
          grep -qi 'FMB Worldwide' /tmp/news-world.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/fmb-brief/' /tmp/news-brief.html /tmp/news-brief.headers 'FMB Daily Brief'
          grep -Eqi 'FMB Daily Brief|Daily Newsletter' /tmp/news-brief.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/explainer/' /tmp/news-explainer.html /tmp/news-explainer.headers 'FMB Explainer'
          grep -qi 'FMB Explainer' /tmp/news-explainer.html

          fetch_with_retry 'https://www.francinemariebautista.com/news/philippines-womens-soft-tennis-first-asian-games-medal-september-19-2026/' /tmp/news-cms-article.html /tmp/news-cms-article.headers 'FMB News live CMS canonical article'
          grep -Fqi 'PH Women’s Soft Tennis Secures Historic First Asian Games Medal' /tmp/news-cms-article.html

          legacy_headers="$(curl --silent --show-error --head --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            'https://www.francinemariebautista.com/news/read/philippines-womens-soft-tennis-first-asian-games-medal-september-19-2026/' | tr -d '\r' || true)"
          if echo "$legacy_headers" | grep -Eq '^HTTP/[^ ]+ 308' && \
             echo "$legacy_headers" | grep -Eqi '^location: https://www\.francinemariebautista\.com/news/philippines-womens-soft-tennis-first-asian-games-medal-september-19-2026/?          # This repository owns /news only. The parent site's homepage is an
          # independent deployment and must never make a healthy FMB News release fail.
          apex_headers="$(curl --silent --show-error --head --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://francinemariebautista.com/news/?cutover=${GITHUB_SHA}" | tr -d '\r' || true)"
          if echo "$apex_headers" | grep -Eq '^HTTP/[^ ]+ 308' && \
             echo "$apex_headers" | grep -Eqi '^location: https://www\.francinemariebautista\.com/news/?'; then
            echo 'Apex /news canonical redirect verified.'
          else
            echo '::warning::Apex /news did not return the expected redirect; canonical www newsroom remains healthy.'
          fi

          echo 'Public FMB News deployment and canonical www newsroom verified.'
; then
            echo 'Legacy /news/read article redirect verified.'
          else
            echo '::error::Legacy /news/read article did not redirect to the canonical CMS article route.'
            echo "$legacy_headers"
            exit 1
          fi

          # This repository owns /news only. The parent site's homepage is an
          # independent deployment and must never make a healthy FMB News release fail.
          apex_headers="$(curl --silent --show-error --head --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://francinemariebautista.com/news/?cutover=${GITHUB_SHA}" | tr -d '\r' || true)"
          if echo "$apex_headers" | grep -Eq '^HTTP/[^ ]+ 308' && \
             echo "$apex_headers" | grep -Eqi '^location: https://www\.francinemariebautista\.com/news/?'; then
            echo 'Apex /news canonical redirect verified.'
          else
            echo '::warning::Apex /news did not return the expected redirect; canonical www newsroom remains healthy.'
          fi

          echo 'Public FMB News deployment and canonical www newsroom verified.'
