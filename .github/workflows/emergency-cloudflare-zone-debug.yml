name: Recover Cloudflare zone routing identifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-cloudflare-zone-debug.yml'

permissions:
  contents: read

jobs:
  debug-zone:
    if: github.event.head_commit.message == 'Recover Cloudflare zone routing identifier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build newsroom
        run: npm run build
      - name: Re-deploy with Wrangler debug logging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: debug
        run: npx --yes wrangler@4 deploy
