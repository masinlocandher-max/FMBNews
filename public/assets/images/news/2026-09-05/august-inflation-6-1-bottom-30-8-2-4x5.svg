<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for August 2026 Philippine inflation</title><desc id="d">Non-documentary editorial graphic showing 6.1 percent headline inflation and 8.2 percent inflation for the bottom 30 percent income households.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><circle cx="885" cy="155" r="260" fill="#fff" opacity=".06"/><image href="/assets/images/icon-transparent.png" x="785" y="75" width="215" height="215" preserveAspectRatio="xMidYMid meet"/><text x="78" y="145" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · ECONOMY</text><text x="78" y="390" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">Inflation eases</text><text x="78" y="480" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">to 6.1%</text><text x="78" y="585" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="34">Lower-income households still face</text><text x="78" y="630" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="34">faster price increases.</text><rect x="78" y="735" width="924" height="255" rx="32" fill="#fff" opacity=".11"/><text x="120" y="815" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="3">BOTTOM 30% INCOME HOUSEHOLDS</text><text x="120" y="915" fill="white" font-family="Georgia,serif" font-size="65" font-weight="700">8.2% inflation</text><text x="120" y="965" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="28">August 2026</text><text x="78" y="1245" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="19">PSA data · FMB-owned editorial visual</text><text x="78" y="1280" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="19">Not a documentary photograph</text></svg>