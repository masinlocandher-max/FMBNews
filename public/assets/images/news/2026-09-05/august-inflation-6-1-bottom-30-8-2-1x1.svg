<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for August 2026 Philippine inflation</title><desc id="d">Non-documentary editorial graphic showing 6.1 percent headline inflation and 8.2 percent inflation for the bottom 30 percent income households.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><circle cx="885" cy="135" r="245" fill="#fff" opacity=".06"/><image href="/assets/images/icon-transparent.png" x="800" y="65" width="190" height="190" preserveAspectRatio="xMidYMid meet"/><text x="72" y="135" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="5">FMB NEWS · ECONOMY</text><text x="72" y="355" fill="white" font-family="Georgia,serif" font-size="73" font-weight="700">Inflation eases</text><text x="72" y="445" fill="white" font-family="Georgia,serif" font-size="73" font-weight="700">to 6.1%</text><rect x="72" y="555" width="936" height="230" rx="30" fill="#fff" opacity=".11"/><text x="112" y="625" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="2">BOTTOM 30% INCOME HOUSEHOLDS</text><text x="112" y="720" fill="white" font-family="Georgia,serif" font-size="62" font-weight="700">8.2% inflation</text><text x="72" y="945" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="20">PSA data · FMB-owned editorial visual</text><text x="72" y="980" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="20">Not a documentary photograph</text></svg>