<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for August 2026 Philippine inflation</title><desc id="d">Non-documentary editorial graphic showing 6.1 percent headline inflation and 8.2 percent inflation for the bottom 30 percent income households.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><circle cx="1360" cy="120" r="350" fill="#fff" opacity=".06"/><image href="/assets/images/icon-transparent.png" x="1210" y="95" width="260" height="260" preserveAspectRatio="xMidYMid meet"/><text x="112" y="145" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · ECONOMY</text><text x="112" y="330" fill="white" font-family="Georgia,serif" font-size="92" font-weight="700">Inflation eases to 6.1%</text><text x="112" y="430" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="38">But lower-income households still face faster price increases.</text><rect x="112" y="520" width="1050" height="175" rx="30" fill="#fff" opacity=".11"/><text x="155" y="585" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="3">BOTTOM 30% INCOME HOUSEHOLDS</text><text x="155" y="660" fill="white" font-family="Georgia,serif" font-size="68" font-weight="700">8.2% inflation in August</text><text x="112" y="805" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="21">PSA data · FMB-owned editorial visual · Not a documentary photograph</text></svg>