<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Lea Salonga Hollywood Walk of Fame honor</title><desc id="d">Non-documentary FMB News graphic marking Lea Salonga becoming the first Filipina honored with a Hollywood Walk of Fame star.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient><radialGradient id="r"><stop stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#g)"/><circle cx="1360" cy="125" r="360" fill="url(#r)"/><image href="/assets/images/icon-transparent.png" x="1210" y="90" width="260" height="260" preserveAspectRatio="xMidYMid meet"/><text x="112" y="145" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · CULTURE</text><text x="112" y="335" fill="white" font-family="Georgia,serif" font-size="92" font-weight="700">Lea Salonga</text><text x="112" y="438" fill="white" font-family="Georgia,serif" font-size="72" font-weight="700">makes Walk of Fame history</text><rect x="112" y="520" width="1050" height="170" rx="30" fill="#fff" opacity=".11"/><text x="155" y="588" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="3">HOLLYWOOD · SEPTEMBER 4, 2026</text><text x="155" y="655" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">First Filipina to receive a Hollywood Walk of Fame star</text><text x="112" y="805" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="21">Hollywood Chamber of Commerce · FMB-owned editorial visual · Not a documentary photograph</text></svg>