<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Lea Salonga Hollywood Walk of Fame honor</title><desc id="d">Non-documentary FMB News graphic marking Lea Salonga becoming the first Filipina honored with a Hollywood Walk of Fame star.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><circle cx="880" cy="120" r="280" fill="#fff" opacity=".06"/><image href="/assets/images/icon-transparent.png" x="770" y="60" width="210" height="210" preserveAspectRatio="xMidYMid meet"/><text x="72" y="120" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · CULTURE</text><text x="72" y="350" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">Lea Salonga</text><text x="72" y="445" fill="white" font-family="Georgia,serif" font-size="58" font-weight="700">makes Walk of Fame</text><text x="72" y="515" fill="white" font-family="Georgia,serif" font-size="58" font-weight="700">history</text><rect x="72" y="600" width="880" height="220" rx="30" fill="#fff" opacity=".11"/><text x="110" y="675" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="3">HOLLYWOOD · SEPTEMBER 4, 2026</text><text x="110" y="755" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">First Filipina to receive a Hollywood</text><text x="110" y="805" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">Walk of Fame star</text><text x="72" y="1010" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>