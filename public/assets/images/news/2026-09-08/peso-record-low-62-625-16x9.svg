<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the Philippine peso record low</title><desc id="d">Non-documentary FMB News graphic reporting the Philippine peso close of 62.625 to the US dollar on September 8, 2026.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="1215" y="90" width="255" height="255"/><text x="110" y="145" fill="#F9AB60" font-family="Arial" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · ECONOMY</text><text x="110" y="310" fill="white" font-family="Georgia" font-size="72" font-weight="700">Peso closes at record low</text><text x="110" y="405" fill="white" font-family="Georgia" font-size="88" font-weight="700">₱62.625 per US$1</text><rect x="110" y="490" width="1160" height="175" rx="28" fill="#fff" opacity=".11"/><text x="150" y="560" fill="#F9AB60" font-family="Arial" font-size="27" font-weight="700">SEPTEMBER 8, 2026</text><text x="150" y="620" fill="white" font-family="Arial" font-size="30">Stronger dollar and higher oil prices add pressure</text><text x="110" y="805" fill="#F6EAF8" font-family="Arial" font-size="21">FMB-owned editorial visual · Not a documentary photograph</text></svg>