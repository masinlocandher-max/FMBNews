<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on PSA testimony in the Sara Duterte impeachment trial</title><desc id="d">Non-documentary FMB News graphic reporting that the PSA found no matching civil-registry records for 1,685 names checked from OVP and DepEd confidential-fund payee lists, while the defense said recipient names were aliases.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".60" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="80" width="220" height="220"/><text x="78" y="145" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · NATION</text><text x="78" y="390" fill="white" font-family="Georgia" font-size="70" font-weight="700">PSA: 1,685</text><text x="78" y="480" fill="white" font-family="Georgia" font-size="62" font-weight="700">payee names had</text><text x="78" y="565" fill="white" font-family="Georgia" font-size="62" font-weight="700">no matching</text><text x="78" y="650" fill="white" font-family="Georgia" font-size="62" font-weight="700">civil records</text><rect x="78" y="735" width="900" height="230" rx="28" fill="#fff" opacity=".11"/><text x="115" y="810" fill="#F9AB60" font-family="Arial" font-size="23" font-weight="700">SARA DUTERTE IMPEACHMENT TRIAL</text><text x="115" y="865" fill="white" font-family="Arial" font-size="29">Defense says recipient names</text><text x="115" y="910" fill="white" font-family="Arial" font-size="29">were aliases</text><text x="78" y="1235" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Trial evidence, not a finding of guilt</text><text x="78" y="1270" fill="#F6EAF8" font-family="Arial" font-size="19">Not a documentary photograph</text></svg>