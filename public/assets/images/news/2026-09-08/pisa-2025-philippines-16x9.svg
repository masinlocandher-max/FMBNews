<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the Philippines PISA 2025 results</title><desc id="d">Non-documentary FMB News graphic reporting the Philippines' highest PISA scores to date in science, mathematics and reading, while noting that major learning gaps remain.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="1210" y="90" width="260" height="260"/><text x="112" y="145" fill="#F9AB60" font-family="Arial" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · EDUCATION</text><text x="112" y="300" fill="white" font-family="Georgia" font-size="68" font-weight="700">Philippines posts its highest</text><text x="112" y="388" fill="white" font-family="Georgia" font-size="68" font-weight="700">PISA scores yet</text><rect x="112" y="470" width="1160" height="205" rx="28" fill="#fff" opacity=".11"/><text x="155" y="540" fill="#F9AB60" font-family="Arial" font-size="27" font-weight="700">PISA 2025 · RELEASED SEPTEMBER 8, 2026</text><text x="155" y="600" fill="white" font-family="Arial" font-size="31">Science 373 · Mathematics 371 · Reading 367</text><text x="155" y="648" fill="#F6EAF8" font-family="Arial" font-size="24">Scores improved, but large proficiency gaps remain</text><text x="112" y="805" fill="#F6EAF8" font-family="Arial" font-size="21">FMB-owned editorial visual · Based on OECD PISA 2025 data · Not a documentary photograph</text></svg>