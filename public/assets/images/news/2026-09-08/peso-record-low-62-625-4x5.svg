<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the Philippine peso record low</title><desc id="d">Non-documentary FMB News graphic reporting the Philippine peso close of 62.625 to the US dollar on September 8, 2026.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="80" width="220" height="220"/><text x="80" y="135" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · ECONOMY</text><text x="80" y="430" fill="white" font-family="Georgia" font-size="68" font-weight="700">Peso closes at</text><text x="80" y="515" fill="white" font-family="Georgia" font-size="68" font-weight="700">record low</text><text x="80" y="655" fill="white" font-family="Georgia" font-size="92" font-weight="700">₱62.625</text><text x="80" y="735" fill="white" font-family="Georgia" font-size="55" font-weight="700">per US$1</text><rect x="80" y="840" width="920" height="205" rx="28" fill="#fff" opacity=".11"/><text x="120" y="915" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">SEPTEMBER 8, 2026</text><text x="120" y="980" fill="white" font-family="Arial" font-size="27">Dollar strength and higher oil prices</text><text x="120" y="1025" fill="white" font-family="Arial" font-size="27">add pressure to the currency</text><text x="80" y="1260" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>