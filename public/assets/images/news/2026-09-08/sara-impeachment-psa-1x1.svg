<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on PSA testimony in the Sara Duterte impeachment trial</title><desc id="d">Non-documentary FMB News graphic reporting that the PSA found no matching civil-registry records for 1,685 names checked from OVP and DepEd confidential-fund payee lists, while the defense said recipient names were aliases.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".60" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="770" y="70" width="210" height="210"/><text x="76" y="135" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · NATION</text><text x="76" y="350" fill="white" font-family="Georgia" font-size="66" font-weight="700">PSA: 1,685 payee</text><text x="76" y="435" fill="white" font-family="Georgia" font-size="61" font-weight="700">names had no matching</text><text x="76" y="520" fill="white" font-family="Georgia" font-size="61" font-weight="700">civil records</text><rect x="76" y="605" width="900" height="175" rx="28" fill="#fff" opacity=".11"/><text x="112" y="675" fill="#F9AB60" font-family="Arial" font-size="22" font-weight="700">SARA DUTERTE IMPEACHMENT TRIAL</text><text x="112" y="730" fill="white" font-family="Arial" font-size="28">Defense says recipient names were aliases</text><text x="76" y="970" fill="#F6EAF8" font-family="Arial" font-size="18">FMB-owned editorial visual · Trial evidence, not a finding of guilt</text><text x="76" y="1005" fill="#F6EAF8" font-family="Arial" font-size="18">Not a documentary photograph</text></svg>