<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News Anak Krakatau airport reopening social visual</title><desc id="d">Non-documentary FMB News graphic reporting that Jakarta's main airport and four other Indonesian airports reopened on September 8, 2026 after Anak Krakatau volcanic ash disruptions.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="85" width="220" height="220"/><text x="80" y="145" fill="#F9AB60" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">FMB NEWS · DEVELOPING</text><text x="80" y="365" fill="white" font-family="Georgia,serif" font-size="66" font-weight="700">Jakarta airport</text><text x="80" y="445" fill="white" font-family="Georgia,serif" font-size="66" font-weight="700">reopens</text><text x="80" y="610" fill="white" font-family="Arial,sans-serif" font-size="37" font-weight="700">5 airports operating again</text><text x="80" y="680" fill="white" font-family="Arial,sans-serif" font-size="37" font-weight="700">2 airports remain closed</text><text x="80" y="750" fill="white" font-family="Arial,sans-serif" font-size="37" font-weight="700">Inspections continue</text><text x="80" y="1100" fill="#F9AB60" font-family="Arial,sans-serif" font-size="24" font-weight="700">INDONESIA · SEPTEMBER 8, 2026</text><text x="80" y="1240" fill="#F6EAF8" font-family="Arial,sans-serif" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>