<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News Anak Krakatau airport reopening square visual</title><desc id="d">Non-documentary FMB News graphic reporting that Jakarta's main airport and four other Indonesian airports reopened on September 8, 2026 after Anak Krakatau volcanic ash disruptions.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="70" width="220" height="220"/><text x="80" y="135" fill="#F9AB60" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">FMB NEWS · DEVELOPING</text><text x="80" y="340" fill="white" font-family="Georgia,serif" font-size="65" font-weight="700">Jakarta airport</text><text x="80" y="420" fill="white" font-family="Georgia,serif" font-size="65" font-weight="700">reopens</text><text x="80" y="570" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="700">5 airports operating again</text><text x="80" y="640" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="700">2 remain closed</text><text x="80" y="710" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="700">Inspections continue</text><text x="80" y="900" fill="#F9AB60" font-family="Arial,sans-serif" font-size="23" font-weight="700">INDONESIA · SEPTEMBER 8, 2026</text><text x="80" y="1000" fill="#F6EAF8" font-family="Arial,sans-serif" font-size="18">FMB-owned editorial visual · Not a documentary photograph</text></svg>