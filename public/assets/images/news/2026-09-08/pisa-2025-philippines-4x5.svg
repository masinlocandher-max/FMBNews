<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News PISA 2025 Philippines social graphic</title><desc id="d">Non-documentary FMB News graphic showing the Philippines' PISA 2025 scores in science, mathematics and reading.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="90" width="220" height="220"/><text x="80" y="150" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · EDUCATION</text><text x="80" y="370" fill="white" font-family="Georgia" font-size="62" font-weight="700">Philippines posts</text><text x="80" y="448" fill="white" font-family="Georgia" font-size="62" font-weight="700">highest PISA</text><text x="80" y="526" fill="white" font-family="Georgia" font-size="62" font-weight="700">scores yet</text><rect x="80" y="620" width="920" height="320" rx="28" fill="#fff" opacity=".11"/><text x="120" y="700" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">PISA 2025</text><text x="120" y="770" fill="white" font-family="Arial" font-size="36">Science 373</text><text x="120" y="830" fill="white" font-family="Arial" font-size="36">Mathematics 371</text><text x="120" y="890" fill="white" font-family="Arial" font-size="36">Reading 367</text><text x="80" y="1125" fill="#F6EAF8" font-family="Arial" font-size="25">Improvement is real. Learning gaps remain large.</text><text x="80" y="1245" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>