<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on PSA testimony in the Sara Duterte impeachment trial</title><desc id="d">Non-documentary FMB News graphic reporting that the PSA found no matching civil-registry records for 1,685 names checked from OVP and DepEd confidential-fund payee lists, while the defense said recipient names were aliases.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="1210" y="90" width="260" height="260"/><text x="112" y="145" fill="#F9AB60" font-family="Arial" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · NATION</text><text x="112" y="305" fill="white" font-family="Georgia" font-size="70" font-weight="700">PSA: 1,685 payee names</text><text x="112" y="395" fill="white" font-family="Georgia" font-size="64" font-weight="700">had no matching civil records</text><rect x="112" y="485" width="1160" height="190" rx="28" fill="#fff" opacity=".11"/><text x="155" y="555" fill="#F9AB60" font-family="Arial" font-size="27" font-weight="700">SARA DUTERTE IMPEACHMENT TRIAL · SEPTEMBER 7, 2026</text><text x="155" y="615" fill="white" font-family="Arial" font-size="31">Defense says confidential-fund recipient names were aliases</text><text x="112" y="805" fill="#F6EAF8" font-family="Arial" font-size="21">FMB-owned editorial visual · Trial evidence, not a finding of guilt · Not a documentary photograph</text></svg>