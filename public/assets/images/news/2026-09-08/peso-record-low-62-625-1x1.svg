<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the Philippine peso record low</title><desc id="d">Non-documentary FMB News graphic reporting the Philippine peso close of 62.625 to the US dollar on September 8, 2026.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="70" width="220" height="220"/><text x="75" y="125" fill="#F9AB60" font-family="Arial" font-size="23" font-weight="700" letter-spacing="5">FMB NEWS · ECONOMY</text><text x="75" y="390" fill="white" font-family="Georgia" font-size="64" font-weight="700">Peso closes at</text><text x="75" y="475" fill="white" font-family="Georgia" font-size="64" font-weight="700">record low</text><text x="75" y="625" fill="white" font-family="Georgia" font-size="88" font-weight="700">₱62.625</text><text x="75" y="700" fill="white" font-family="Georgia" font-size="52" font-weight="700">per US$1</text><rect x="75" y="790" width="900" height="140" rx="25" fill="#fff" opacity=".11"/><text x="115" y="850" fill="#F9AB60" font-family="Arial" font-size="23" font-weight="700">SEPTEMBER 8, 2026</text><text x="115" y="900" fill="white" font-family="Arial" font-size="25">Dollar strength and higher oil prices add pressure</text><text x="75" y="1015" fill="#F6EAF8" font-family="Arial" font-size="18">FMB-owned editorial visual · Not a documentary photograph</text></svg>