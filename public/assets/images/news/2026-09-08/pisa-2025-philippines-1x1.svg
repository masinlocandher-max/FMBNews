<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News PISA 2025 Philippines square graphic</title><desc id="d">Non-documentary FMB News graphic showing the Philippines' PISA 2025 scores in science, mathematics and reading.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="780" y="70" width="200" height="200"/><text x="78" y="135" fill="#F9AB60" font-family="Arial" font-size="22" font-weight="700" letter-spacing="5">FMB NEWS · EDUCATION</text><text x="78" y="330" fill="white" font-family="Georgia" font-size="58" font-weight="700">Highest PISA</text><text x="78" y="405" fill="white" font-family="Georgia" font-size="58" font-weight="700">scores yet for PH</text><rect x="78" y="500" width="900" height="250" rx="28" fill="#fff" opacity=".11"/><text x="120" y="575" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">PISA 2025</text><text x="120" y="640" fill="white" font-family="Arial" font-size="34">Science 373 · Math 371</text><text x="120" y="700" fill="white" font-family="Arial" font-size="34">Reading 367</text><text x="78" y="900" fill="#F6EAF8" font-family="Arial" font-size="24">Improvement, but major learning gaps remain.</text><text x="78" y="1000" fill="#F6EAF8" font-family="Arial" font-size="18">FMB-owned editorial visual · Not a documentary photograph</text></svg>