<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864" role="img" aria-labelledby="title desc">
  <title id="title">The Newsroom</title>
  <desc id="desc">Neutral editorial title card for FMB Newsroom reports without a dedicated lead photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/>
      <stop offset="0.6" stop-color="#eee7df"/>
      <stop offset="1" stop-color="#ded2c7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20151c"/>
      <stop offset="1" stop-color="#7d243b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1536" height="864" fill="url(#bg)"/>
  <circle cx="1280" cy="120" r="430" fill="url(#glow)"/>
  <circle cx="180" cy="810" r="370" fill="url(#glow)" opacity="0.7"/>
  <rect x="82" y="74" width="1372" height="716" fill="none" stroke="#b8aba1" stroke-width="2"/>
  <line x1="112" y1="160" x2="1424" y2="160" stroke="#7d243b" stroke-width="5"/>
  <line x1="112" y1="706" x2="1424" y2="706" stroke="#b8aba1"/>
  <g transform="translate(116 236)">
    <text x="0" y="0" fill="#7d243b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="8">FRANCINE MARIE BAUTISTA</text>
    <text x="0" y="164" fill="url(#ink)" font-family="Georgia, 'Times New Roman', serif" font-size="144" font-weight="700" letter-spacing="-7">THE NEWSROOM</text>
    <text x="4" y="242" fill="#5f5651" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="5">PHILIPPINES · ZAMBALES · WORLD</text>
    <text x="4" y="360" fill="#342b2f" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic">Public interest. Clear sources. Visible perspective.</text>
  </g>
  <g transform="translate(118 748)" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4">
    <text x="0" y="0" fill="#6a615c">EDITORIAL REPORT</text>
    <text x="1040" y="0" fill="#7d243b">MASINLOC, ZAMBALES</text>
  </g>
  <g opacity="0.16" fill="none" stroke="#7d243b">
    <path d="M970 190c260 70 400 210 455 432"/>
    <path d="M1010 190c250 74 385 208 440 410"/>
    <path d="M86 580c210-90 388-92 580 16"/>
  </g>
</svg>
