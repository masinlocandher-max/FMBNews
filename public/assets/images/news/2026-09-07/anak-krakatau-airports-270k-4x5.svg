<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="t d"><title id="t">FMB News continuation visual for Anak Krakatau airport disruption</title><desc id="d">Non-documentary FMB News graphic reporting seven Indonesian airports closed and more than 270,000 travelers affected by Anak Krakatau volcanic ash on September 7, 2026.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1200" height="1500" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="845" y="80" width="240" height="240"/><text x="85" y="150" fill="#F9AB60" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="85" y="500" fill="white" font-family="Georgia,serif" font-size="76" font-weight="700">Anak Krakatau</text><text x="85" y="590" fill="white" font-family="Georgia,serif" font-size="76" font-weight="700">disruption deepens</text><rect x="85" y="715" width="1030" height="360" rx="30" fill="#fff" opacity=".11"/><text x="125" y="815" fill="white" font-family="Arial,sans-serif" font-size="40" font-weight="700">7 airports remain closed</text><text x="125" y="900" fill="white" font-family="Arial,sans-serif" font-size="40" font-weight="700">2,300 flights affected</text><text x="125" y="985" fill="white" font-family="Arial,sans-serif" font-size="40" font-weight="700">270,000+ travelers impacted</text><text x="85" y="1200" fill="#F9AB60" font-family="Arial,sans-serif" font-size="25" font-weight="700">INDONESIA · SEPTEMBER 7, 2026</text><text x="85" y="1395" fill="#F6EAF8" font-family="Arial,sans-serif" font-size="20">FMB-owned editorial visual · Not a documentary photograph</text></svg>