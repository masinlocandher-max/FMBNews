<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="t d"><title id="t">FMB News continuation visual for Anak Krakatau airport disruption</title><desc id="d">Non-documentary FMB News graphic reporting seven Indonesian airports closed and more than 270,000 travelers affected by Anak Krakatau volcanic ash on September 7, 2026.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1200" height="1200" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="860" y="65" width="220" height="220"/><text x="85" y="135" fill="#F9AB60" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="85" y="390" fill="white" font-family="Georgia,serif" font-size="69" font-weight="700">Anak Krakatau</text><text x="85" y="475" fill="white" font-family="Georgia,serif" font-size="69" font-weight="700">disruption deepens</text><text x="85" y="640" fill="white" font-family="Arial,sans-serif" font-size="37" font-weight="700">7 airports remain closed</text><text x="85" y="710" fill="white" font-family="Arial,sans-serif" font-size="37" font-weight="700">2,300 flights affected</text><text x="85" y="780" fill="white" font-family="Arial,sans-serif" font-size="37" font-weight="700">270,000+ travelers impacted</text><text x="85" y="930" fill="#F9AB60" font-family="Arial,sans-serif" font-size="24" font-weight="700">INDONESIA · SEPTEMBER 7, 2026</text><text x="85" y="1105" fill="#F6EAF8" font-family="Arial,sans-serif" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>