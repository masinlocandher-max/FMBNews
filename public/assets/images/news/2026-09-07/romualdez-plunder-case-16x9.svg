<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Ombudsman plunder case filing against Martin Romualdez</title><desc id="d">Non-documentary FMB News graphic reporting the September 7, 2026 filing of a plunder case against former House Speaker Martin Romualdez.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient><radialGradient id="r"><stop stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#g)"/><circle cx="1360" cy="125" r="360" fill="url(#r)"/><image href="/assets/images/icon-transparent.png" x="1210" y="90" width="260" height="260" preserveAspectRatio="xMidYMid meet"/><text x="112" y="145" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · NATION</text><text x="112" y="310" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">Ombudsman files plunder case</text><text x="112" y="405" fill="white" font-family="Georgia,serif" font-size="68" font-weight="700">against Martin Romualdez</text><rect x="112" y="500" width="1110" height="185" rx="30" fill="#fff" opacity=".11"/><text x="155" y="570" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="3">SANDIGANBAYAN · SEPTEMBER 7, 2026</text><text x="155" y="635" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">Case alleges a ₱7.4B flood-control kickback scheme</text><text x="112" y="805" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="21">FMB-owned editorial visual · Allegations remain unproven · Not a documentary photograph</text></svg>