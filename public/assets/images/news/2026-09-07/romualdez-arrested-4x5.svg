<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Martin Romualdez arrest</title><desc id="d">Non-documentary FMB News graphic reporting the September 7, 2026 arrest of former House Speaker Martin Romualdez in a plunder case.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="90" width="220" height="220"/><text x="80" y="145" fill="#F9AB60" font-family="Arial" font-size="26" font-weight="700" letter-spacing="5">FMB NEWS · NATION</text><text x="80" y="410" fill="white" font-family="Georgia" font-size="70" font-weight="700">Romualdez served</text><text x="80" y="495" fill="white" font-family="Georgia" font-size="70" font-weight="700">arrest warrant</text><text x="80" y="580" fill="white" font-family="Georgia" font-size="58" font-weight="700">in ₱7.44B plunder case</text><rect x="80" y="690" width="920" height="250" rx="28" fill="#fff" opacity=".11"/><text x="120" y="770" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">SEPTEMBER 7, 2026</text><text x="120" y="835" fill="white" font-family="Arial" font-size="31">Booking completed while</text><text x="120" y="880" fill="white" font-family="Arial" font-size="31">he remains hospitalized</text><text x="80" y="1240" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Allegations remain unproven</text><text x="80" y="1275" fill="#F6EAF8" font-family="Arial" font-size="19">Not a documentary photograph</text></svg>