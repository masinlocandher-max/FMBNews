<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for September 8 Philippine fuel price increases</title><desc id="d">Non-documentary FMB News graphic showing confirmed gasoline, diesel and kerosene price increases effective September 8, 2026.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="1240" y="80" width="250" height="250"/><text x="110" y="140" fill="#F9AB60" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="5">FMB NEWS · MONEY</text><text x="110" y="305" fill="white" font-family="Georgia,serif" font-size="82" font-weight="700">Fuel prices rise September 8</text><text x="110" y="455" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">Gasoline +₱4.69/L</text><text x="110" y="525" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">Diesel +₱5.18/L</text><text x="110" y="595" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">Kerosene +₱5.58/L</text><text x="110" y="705" fill="#F9AB60" font-family="Arial,sans-serif" font-size="26" font-weight="700">DOE-CONFIRMED ADJUSTMENTS</text><text x="110" y="805" fill="#F6EAF8" font-family="Arial,sans-serif" font-size="21">FMB-owned editorial visual · Not a documentary photograph</text></svg>