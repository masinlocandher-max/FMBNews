<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for September 8 Philippine fuel price increases</title><desc id="d">Non-documentary FMB News graphic showing confirmed gasoline, diesel and kerosene price increases effective September 8, 2026.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1200" height="1500" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="845" y="80" width="240" height="240"/><text x="85" y="150" fill="#F9AB60" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5">FMB NEWS · MONEY</text><text x="85" y="500" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">Fuel prices rise</text><text x="85" y="595" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">September 8</text><rect x="85" y="720" width="1030" height="355" rx="30" fill="#fff" opacity=".11"/><text x="125" y="820" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Gasoline +₱4.69/L</text><text x="125" y="900" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Diesel +₱5.18/L</text><text x="125" y="980" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Kerosene +₱5.58/L</text><text x="85" y="1195" fill="#F9AB60" font-family="Arial,sans-serif" font-size="25" font-weight="700">DOE-CONFIRMED ADJUSTMENTS</text><text x="85" y="1395" fill="#F6EAF8" font-family="Arial,sans-serif" font-size="20">FMB-owned editorial visual · Not a documentary photograph</text></svg>