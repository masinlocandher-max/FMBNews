<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Martin Romualdez arrest</title><desc id="d">Non-documentary FMB News graphic reporting the September 7, 2026 arrest of former House Speaker Martin Romualdez in a plunder case.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="1210" y="90" width="260" height="260"/><text x="112" y="145" fill="#F9AB60" font-family="Arial" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · NATION</text><text x="112" y="320" fill="white" font-family="Georgia" font-size="78" font-weight="700">Romualdez served arrest warrant</text><text x="112" y="420" fill="white" font-family="Georgia" font-size="62" font-weight="700">in ₱7.44B plunder case</text><rect x="112" y="505" width="1120" height="170" rx="28" fill="#fff" opacity=".11"/><text x="155" y="575" fill="#F9AB60" font-family="Arial" font-size="27" font-weight="700">SEPTEMBER 7, 2026 · SAN JUAN CITY</text><text x="155" y="635" fill="white" font-family="Arial" font-size="32">Booking completed while he remains hospitalized</text><text x="112" y="805" fill="#F6EAF8" font-family="Arial" font-size="21">FMB-owned editorial visual · Allegations remain unproven · Not a documentary photograph</text></svg>