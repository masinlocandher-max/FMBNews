<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News continuation visual for Anak Krakatau airport disruption</title><desc id="d">Non-documentary FMB News graphic reporting seven Indonesian airports closed and more than 270,000 travelers affected by Anak Krakatau volcanic ash on September 7, 2026.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="1240" y="80" width="250" height="250"/><text x="110" y="140" fill="#F9AB60" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="110" y="305" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">Anak Krakatau disruption deepens</text><text x="110" y="420" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">7 airports remain closed</text><text x="110" y="495" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">2,300 flights affected</text><text x="110" y="570" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="700">270,000+ travelers impacted</text><text x="110" y="705" fill="#F9AB60" font-family="Arial,sans-serif" font-size="26" font-weight="700">INDONESIA · SEPTEMBER 7, 2026</text><text x="110" y="805" fill="#F6EAF8" font-family="Arial,sans-serif" font-size="21">FMB-owned editorial visual · Not a documentary photograph</text></svg>