<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Ombudsman plunder case filing against Martin Romualdez</title><desc id="d">Non-documentary FMB News graphic reporting the September 7, 2026 filing of a plunder case against former House Speaker Martin Romualdez.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient><radialGradient id="r"><stop stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="1200" fill="url(#g)"/><circle cx="1030" cy="130" r="300" fill="url(#r)"/><image href="/assets/images/icon-transparent.png" x="855" y="65" width="220" height="220" preserveAspectRatio="xMidYMid meet"/><text x="85" y="135" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · NATION</text><text x="85" y="390" fill="white" font-family="Georgia,serif" font-size="70" font-weight="700">Ombudsman files</text><text x="85" y="480" fill="white" font-family="Georgia,serif" font-size="70" font-weight="700">plunder case</text><text x="85" y="570" fill="white" font-family="Georgia,serif" font-size="64" font-weight="700">against Romualdez</text><rect x="85" y="670" width="1030" height="205" rx="28" fill="#fff" opacity=".11"/><text x="125" y="745" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="2">SEPTEMBER 7, 2026</text><text x="125" y="815" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700">Case alleges a ₱7.4B flood-control scheme</text><text x="85" y="1080" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="19">Allegations remain unproven</text><text x="85" y="1118" fill="#F6EAF8" f