<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Anak Krakatau eruption and Jakarta airport disruption</title><desc id="d">Non-documentary FMB News graphic about volcanic ash from Anak Krakatau suspending flights at Jakarta's main airport.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient><radialGradient id="r"><stop stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><circle cx="880" cy="180" r="330" fill="url(#r)"/><image href="/assets/images/icon-transparent.png" x="775" y="95" width="210" height="210" preserveAspectRatio="xMidYMid meet"/><text x="78" y="145" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · WORLD</text><text x="78" y="410" fill="white" font-family="Georgia,serif" font-size="72" font-weight="700">Anak Krakatau</text><text x="78" y="495" fill="white" font-family="Georgia,serif" font-size="72" font-weight="700">erupts</text><text x="78" y="610" fill="white" font-family="Georgia,serif" font-size="58" font-weight="700">Jakarta flights</text><text x="78" y="682" fill="white" font-family="Georgia,serif" font-size="58" font-weight="700">suspended</text><rect x="78" y="785" width="900" height="220" rx="28" fill="#fff" opacity=".11"/><text x="118" y="865" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="2">SEPTEMBER 6, 2026</text><text x="118" y="935" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">Volcanic ash disrupts</text><text x="118" y="980" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"