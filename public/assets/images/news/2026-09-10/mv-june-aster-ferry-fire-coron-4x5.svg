<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News social visual on the MV June Aster ferry fire off Coron</title><desc id="d">Non-documentary FMB News graphic on the September 9, 2026 MV June Aster ferry fire off Coron, Palawan, where at least five people were confirmed dead and search and rescue operations continued.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="745" y="90" width="220" height="220"/><text x="85" y="150" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="85" y="390" fill="white" font-family="Georgia" font-size="61" font-weight="700">Ferry fire off Coron</text><text x="85" y="470" fill="white" font-family="Georgia" font-size="61" font-weight="700">leaves at least</text><text x="85" y="550" fill="white" font-family="Georgia" font-size="61" font-weight="700">five dead</text><rect x="85" y="670" width="910" height="240" rx="28" fill="#fff" opacity=".11"/><text x="125" y="748" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">MV JUNE ASTER · CORON, PALAWAN</text><text x="125" y="818" fill="white" font-family="Arial" font-size="28">Search and rescue continues.</text><text x="125" y="865" fill="white" font-family="Arial" font-size="28">Preliminary totals may change.</text><text x="85" y="1240" fill="#F6EAF8" font-family="Arial" font-size="20">FMB-owned editorial visual · Not a documentary photograph</text></svg>