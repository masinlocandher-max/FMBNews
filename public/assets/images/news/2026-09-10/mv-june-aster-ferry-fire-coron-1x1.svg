<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News square visual on the MV June Aster ferry fire off Coron</title><desc id="d">Non-documentary FMB News graphic on the September 9, 2026 MV June Aster ferry fire off Coron, Palawan, where at least five people were confirmed dead and search and rescue operations continued.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="775" y="70" width="210" height="210"/><text x="80" y="135" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="80" y="340" fill="white" font-family="Georgia" font-size="59" font-weight="700">Ferry fire off Coron</text><text x="80" y="420" fill="white" font-family="Georgia" font-size="59" font-weight="700">leaves at least</text><text x="80" y="500" fill="white" font-family="Georgia" font-size="59" font-weight="700">five dead</text><rect x="80" y="600" width="920" height="200" rx="28" fill="#fff" opacity=".11"/><text x="120" y="675" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">MV JUNE ASTER · CORON, PALAWAN</text><text x="120" y="735" fill="white" font-family="Arial" font-size="27">Search and rescue continues</text><text x="80" y="990" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>