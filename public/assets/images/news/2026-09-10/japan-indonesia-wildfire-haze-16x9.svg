<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on Japan's wildfire assistance mission in Indonesia</title><desc id="d">Non-documentary FMB News graphic on Japan's September 10, 2026 arrival in Indonesia with helicopters for wildfire response as regional haze remains a concern.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="1215" y="90" width="255" height="255"/><text x="110" y="145" fill="#F9AB60" font-family="Arial" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · WORLDWIDE</text><text x="110" y="300" fill="white" font-family="Georgia" font-size="64" font-weight="700">Japan wildfire mission</text><text x="110" y="385" fill="white" font-family="Georgia" font-size="64" font-weight="700">reaches Indonesia</text><rect x="110" y="475" width="1160" height="185" rx="28" fill="#fff" opacity=".11"/><text x="150" y="545" fill="#F9AB60" font-family="Arial" font-size="27" font-weight="700">BORNEO · REGIONAL HAZE RESPONSE</text><text x="150" y="605" fill="white" font-family="Arial" font-size="28">Three CH-47 helicopters are set to support firefighting operations</text><text x="110" y="805" fill="#F6EAF8" font-family="Arial" font-size="21">FMB-owned editorial visual · Not a documentary photograph</text></svg>