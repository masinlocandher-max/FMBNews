<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the MV June Aster ferry fire off Coron</title><desc id="d">Non-documentary FMB News graphic on the September 9, 2026 MV June Aster ferry fire off Coron, Palawan, where at least five people were confirmed dead and search and rescue operations continued.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="1215" y="90" width="255" height="255"/><text x="110" y="145" fill="#F9AB60" font-family="Arial" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · DEVELOPING</text><text x="110" y="300" fill="white" font-family="Georgia" font-size="67" font-weight="700">Ferry fire off Coron leaves</text><text x="110" y="390" fill="white" font-family="Georgia" font-size="67" font-weight="700">at least five dead</text><rect x="110" y="480" width="1160" height="180" rx="28" fill="#fff" opacity=".11"/><text x="150" y="550" fill="#F9AB60" font-family="Arial" font-size="27" font-weight="700">MV JUNE ASTER · CORON, PALAWAN</text><text x="150" y="612" fill="white" font-family="Arial" font-size="29">Search and rescue continues; preliminary totals may change</text><text x="110" y="805" fill="#F6EAF8" font-family="Arial" font-size="21">FMB-owned editorial visual · Not a documentary photograph</text></svg>