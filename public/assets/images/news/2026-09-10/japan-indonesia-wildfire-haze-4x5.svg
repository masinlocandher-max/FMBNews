<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="t d"><title id="t">FMB News social visual on Japan's wildfire assistance mission in Indonesia</title><desc id="d">Non-documentary FMB News graphic on Japan's September 10, 2026 arrival in Indonesia with helicopters for wildfire response as regional haze remains a concern.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1200" height="1500" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="825" y="90" width="240" height="240"/><text x="90" y="150" fill="#F9AB60" font-family="Arial" font-size="26" font-weight="700" letter-spacing="5">FMB NEWS · WORLDWIDE</text><text x="90" y="430" fill="white" font-family="Georgia" font-size="70" font-weight="700">Japan wildfire</text><text x="90" y="520" fill="white" font-family="Georgia" font-size="70" font-weight="700">mission reaches</text><text x="90" y="610" fill="white" font-family="Georgia" font-size="70" font-weight="700">Indonesia</text><rect x="90" y="720" width="1020" height="250" rx="30" fill="#fff" opacity=".11"/><text x="130" y="800" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">BORNEO · REGIONAL HAZE RESPONSE</text><text x="130" y="870" fill="white" font-family="Arial" font-size="27">Three CH-47 helicopters are set to support</text><text x="130" y="915" fill="white" font-family="Arial" font-size="27">firefighting operations</text><text x="90" y="1375" fill="#F6EAF8" font-family="Arial" font-size="20">FMB-owned editorial visual · Not a documentary photograph</text></svg>