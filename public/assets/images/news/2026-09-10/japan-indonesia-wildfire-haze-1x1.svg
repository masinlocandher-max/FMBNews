<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="t d"><title id="t">FMB News square visual on Japan's wildfire assistance mission in Indonesia</title><desc id="d">Non-documentary FMB News graphic on Japan's September 10, 2026 arrival in Indonesia with helicopters for wildfire response as regional haze remains a concern.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1200" height="1200" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="830" y="70" width="220" height="220"/><text x="90" y="145" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">FMB NEWS · WORLDWIDE</text><text x="90" y="385" fill="white" font-family="Georgia" font-size="66" font-weight="700">Japan wildfire</text><text x="90" y="470" fill="white" font-family="Georgia" font-size="66" font-weight="700">mission reaches</text><text x="90" y="555" fill="white" font-family="Georgia" font-size="66" font-weight="700">Indonesia</text><rect x="90" y="650" width="1020" height="220" rx="28" fill="#fff" opacity=".11"/><text x="130" y="725" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">BORNEO · REGIONAL HAZE RESPONSE</text><text x="130" y="790" fill="white" font-family="Arial" font-size="26">Three CH-47 helicopters are set to support</text><text x="130" y="835" fill="white" font-family="Arial" font-size="26">firefighting operations</text><text x="90" y="1100" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>