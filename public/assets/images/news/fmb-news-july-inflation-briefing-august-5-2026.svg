<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">FMB News July inflation briefing</title><desc id="desc">Blue and white FMB News editorial cover announcing the Philippine Statistics Authority briefing on July 2026 inflation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061a3d"/><stop offset="1" stop-color="#123d7a"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="1080" cy="95" r="210" fill="#ffffff" opacity=".06"/><path d="M0 520 C260 420 470 590 760 470 C930 400 1040 420 1200 350 V630 H0Z" fill="#ffffff" opacity=".07"/><g fill="none" stroke="#f2c75c" stroke-width="16" opacity=".95"><path d="M80 410 L240 350 L390 372 L560 265 L720 300 L880 185 L1060 220"/><path d="M1060 220 l-35 -10 m35 10 l-15 34"/></g><text x="74" y="92" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="7">FMB NEWS</text><text x="74" y="178" fill="#f2c75c" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="4">BUSINESS &amp; ECONOMY</text><text x="74" y="275" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800">JULY INFLATION</text><text x="74" y="344" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800">BRIEFING</text><text x="78" y="405" fill="#dbe9ff" font-family="Arial,Helvetica,sans-serif" font-size="25">PSA schedules the official July 2026 report for August 5</text><rect x="74" y="478" width="495" height="2" fill="#f2c75c"/><text x="74" y="528" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="3">CLEARER. SHARPER. FOR EVERY FILIPINO.</text><text x="1170" y="602" fill="#fff" opacity=".82" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="16">Source: Philippine Statistics Authority</text></svg>