<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">Voting begins in first regular BARMM parliamentary election</title><desc id="d">FMB News editorial graphic for the September 14, 2026 Bangsamoro parliamentary election. Not a documentary photograph.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><rect x="58" y="58" width="964" height="1234" rx="42" fill="#120720" fill-opacity=".48" stroke="#F9AB60" stroke-opacity=".4"/><image href="/assets/images/icon-transparent.png" x="760" y="90" width="220" height="220"/><text x="92" y="160" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="92" y="420" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="800">HISTORIC</text><text x="92" y="510" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="800">BARMM VOTE</text><text x="92" y="600" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="800">UNDERWAY</text><text x="92" y="730" fill="#F7D8FF" font-family="Arial,Helvetica,sans-serif" font-size="34">First regular parliamentary election</text><text x="92" y="785" fill="#F7D8FF" font-family="Arial,Helvetica,sans-serif" font-size="34">2.393M registered voters</text><line x1="92" y1="900" x2="988" y2="900" stroke="#F9AB60" stroke-width="3" stroke-opacity=".7"/><text x="92" y="975" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="28">BANGSAMORO</text><text x="92" y="1030" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="28">SEPTEMBER 14, 2026</text><text x="92" y="1190" fill="#D8CBE8" font-family="Arial,Helvetica,sans-serif" font-size="22">FMB-owned editorial visual</text><text x="92" y="1228" fill="#D8CBE8" font-family="Arial,Helvetica,sans-serif" font-size="22">Not a documentary photograph</text></svg>