<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Philippines haze air-quality shift editorial visual</title><desc id="desc">FMB News original editorial graphic showing improving Metro Manila air quality and haze shifting toward parts of Visayas and Mindanao on September 2, 2026.</desc><rect width="1600" height="900" fill="#f5f1ea"/><rect width="1600" height="28" fill="#d71920"/><text x="90" y="110" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#d71920">FMB NEWS</text><text x="90" y="230" font-family="Georgia,serif" font-size="76" font-weight="700" fill="#111">AIR IMPROVES IN NCR</text><text x="90" y="325" font-family="Georgia,serif" font-size="76" font-weight="700" fill="#111">HAZE SHIFTS SOUTH</text><text x="95" y="400" font-family="Arial,sans-serif" font-size="32" fill="#555">DENR-EMB update · September 2, 2026</text><g opacity=".85"><path d="M1020 190c110 85 140 170 125 260-12 71-56 135-50 220" fill="none" stroke="#555" stroke-width="18" stroke-linecap="round"/><path d="M1115 240c85 75 110 145 95 215-12 58-45 108-40 178" fill="none" stroke="#999" stroke-width="14" stroke-linecap="round"/><circle cx="1020" cy="190" r="22" fill="#d71920"/><circle cx="1095" cy="670" r="22" fill="#d71920"/></g><text x="900" y="150" font-family="Arial,sans-serif" font-size="26" fill="#333">Metro Manila</text><text x="1115" y="715" font-family="Arial,sans-serif" font-size="26" fill="#333">Visayas / Mindanao</text><text x="95" y="790" font-family="Arial,sans-serif" font-size="28" fill="#666">Original editorial graphic · Not a documentary photograph</text></svg>