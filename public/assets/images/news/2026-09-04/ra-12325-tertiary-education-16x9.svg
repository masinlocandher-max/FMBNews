<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Republic Act 12325</title><desc id="d">Non-documentary editorial graphic about expanded tertiary education assistance in the Philippines.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><circle cx="1360" cy="120" r="350" fill="#fff" opacity=".06"/><image href="/assets/images/icon-transparent.png" x="1200" y="105" width="260" height="260" preserveAspectRatio="xMidYMid meet"/><text x="112" y="145" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · EDUCATION</text><text x="112" y="315" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">More support for</text><text x="112" y="405" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">students who need it most</text><text x="112" y="500" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="34">Republic Act 12325 strengthens tertiary education assistance.</text><rect x="112" y="575" width="1040" height="150" rx="30" fill="#fff" opacity=".11"/><text x="155" y="640" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">WHAT CHANGED</text><text x="155" y="690" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="27">Poor and disadvantaged college and TVET learners receive stronger priority.</text><text x="112" y="805" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="21">FMB-owned editorial visual · Not a documentary photograph</text></svg>