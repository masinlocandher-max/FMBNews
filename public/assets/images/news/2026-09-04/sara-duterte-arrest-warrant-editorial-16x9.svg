<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Sara Duterte arrest warrant story</title><desc id="d">Non-documentary editorial graphic about a court-issued arrest warrant in a grave threats case.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D1324"/><stop offset=".6" stop-color="#3E1A46"/><stop offset="1" stop-color="#8B5E3C"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><g transform="translate(112,102)"><text x="0" y="0" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" letter-spacing="6">FMB NEWS · JUDICIARY</text><text x="0" y="92" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">Court issues arrest warrant</text><text x="0" y="180" fill="white" font-family="Georgia,serif" font-size="78" font-weight="700">in VP Sara Duterte case</text><text x="0" y="248" fill="#F2EAF2" font-family="Arial,Helvetica,sans-serif" font-size="32">Three counts of grave threats · Bail set by the court</text></g><g transform="translate(1080,300)"><path d="M200 0 400 100v40H0v-40z" fill="#fff" opacity=".96"/><rect x="35" y="160" width="55" height="300" fill="#fff"/><rect x="125" y="160" width="55" height="300" fill="#fff"/><rect x="215" y="160" width="55" height="300" fill="#fff"/><rect x="305" y="160" width="55" height="300" fill="#fff"/><rect x="0" y="460" width="400" height="48" fill="#F9AB60"/></g><g transform="translate(112,650)"><rect width="820" height="126" rx="28" fill="#fff" opacity=".1"/><text x="38" y="48" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">EDITORIAL VISUAL</text><text x="38" y="88" fill="#F2EAF2" font-family="Arial,Helvetica,sans-serif" font-size="24">Not a photograph of the warrant service, court proceeding, or Vice President.</text></g></svg>