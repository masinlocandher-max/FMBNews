<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Universal Health Care financing</title><desc id="d">Non-documentary editorial graphic about UHC financing and the planned 2027 deployment of health workers.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1730"/><stop offset=".58" stop-color="#2451D9"/><stop offset="1" stop-color="#8FD3FF"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".18"/></filter></defs><rect width="1600" height="900" fill="url(#g)"/><path d="M1120 0c170 90 280 220 350 390s95 350 130 510H1600V0z" fill="#fff" opacity=".06"/><g transform="translate(112,102)"><text x="0" y="0" fill="#8FD3FF" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" letter-spacing="6">FMB NEWS · HEALTH</text><text x="0" y="92" fill="white" font-family="Georgia,serif" font-size="82" font-weight="700">UHC financing gets</text><text x="0" y="182" fill="white" font-family="Georgia,serif" font-size="82" font-weight="700">a 2028 recalibration</text><text x="0" y="252" fill="#E9F5FF" font-family="Arial,Helvetica,sans-serif" font-size="34">DOH also plans to deploy 24,381 health professionals in 2027.</text></g><g transform="translate(1080,330)" filter="url(#s)"><rect x="80" y="0" width="240" height="420" rx="54" fill="#fff"/><rect x="0" y="90" width="400" height="240" rx="54" fill="#fff"/><rect x="155" y="0" width="90" height="420" rx="24" fill="#2451D9"/><rect x="0" y="165" width="400" height="90" rx="24" fill="#2451D9"/></g><g transform="translate(112,650)"><rect width="760" height="126" rx="28" fill="#fff" opacity=".12"/><text x="38" y="48" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">EDITORIAL VISUAL</text><text x="38" y="88" fill="#E9F5FF" font-family="Arial,Helvetica,sans-serif" font-size="24">Not a photograph of the Senate budget hearing or health-worker deployment.</text></g></svg>