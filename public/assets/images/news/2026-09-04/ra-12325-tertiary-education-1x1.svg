<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Republic Act 12325</title><desc id="d">Non-documentary editorial graphic about expanded tertiary education assistance in the Philippines.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><circle cx="930" cy="120" r="280" fill="#fff" opacity=".06"/><image href="/assets/images/icon-transparent.png" x="760" y="65" width="210" height="210"/><text x="78" y="120" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="5">FMB NEWS · EDUCATION</text><text x="78" y="330" fill="white" font-family="Georgia,serif" font-size="70" font-weight="700">More support for</text><text x="78" y="410" fill="white" font-family="Georgia,serif" font-size="70" font-weight="700">students who</text><text x="78" y="490" fill="white" font-family="Georgia,serif" font-size="70" font-weight="700">need it most</text><text x="78" y="585" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="30">Republic Act 12325 strengthens</text><text x="78" y="628" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="30">tertiary education assistance.</text><rect x="78" y="700" width="924" height="170" rx="30" fill="#fff" opacity=".1"/><text x="115" y="766" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">POOR AND DISADVANTAGED LEARNERS</text><text x="115" y="817" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="26">receive stronger priority under the new law.</text><text x="78" y="980" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="21">FMB-owned editorial visual · Not a documentary photograph</text></svg>