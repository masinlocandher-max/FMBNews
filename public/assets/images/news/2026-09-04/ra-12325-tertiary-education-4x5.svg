<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Republic Act 12325</title><desc id="d">Non-documentary editorial graphic about expanded tertiary education assistance in the Philippines.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><circle cx="930" cy="140" r="300" fill="#fff" opacity=".06"/><image href="/assets/images/icon-transparent.png" x="720" y="70" width="250" height="250"/><text x="84" y="130" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="5">FMB NEWS · EDUCATION</text><text x="84" y="360" fill="white" font-family="Georgia,serif" font-size="76" font-weight="700">More support for</text><text x="84" y="445" fill="white" font-family="Georgia,serif" font-size="76" font-weight="700">students who</text><text x="84" y="530" fill="white" font-family="Georgia,serif" font-size="76" font-weight="700">need it most</text><text x="84" y="620" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="32">Republic Act 12325 strengthens</text><text x="84" y="665" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="32">tertiary education assistance.</text><rect x="84" y="760" width="912" height="300" rx="34" fill="#fff" opacity=".1"/><text x="126" y="840" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">WHAT CHANGED</text><text x="126" y="900" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="28">Stronger priority for poor and</text><text x="126" y="945" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="28">disadvantaged college and TVET learners.</text><text x="84" y="1190" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">EDITORIAL VISUAL</text><text x="84" y="1235" fill="#F6EAF8" font-family="Arial,Helvetica,sans-serif" font-size="23">Not a photograph of the September 4 signing ceremony.</text></svg>