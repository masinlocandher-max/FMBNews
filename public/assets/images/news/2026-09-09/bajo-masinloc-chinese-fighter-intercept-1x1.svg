<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News square visual on the Bajo de Masinloc aircraft interception</title><desc id="d">Non-documentary FMB News graphic reporting the AFP-confirmed interception of a Philippine patrol aircraft by a Chinese J-10 over Bajo de Masinloc.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="790" y="70" width="200" height="200"/><text x="75" y="135" fill="#F9AB60" font-family="Arial" font-size="22" font-weight="700" letter-spacing="4">FMB NEWS · WPS</text><text x="75" y="375" fill="white" font-family="Georgia" font-size="58" font-weight="700">Chinese fighter</text><text x="75" y="450" fill="white" font-family="Georgia" font-size="58" font-weight="700">intercepted PH</text><text x="75" y="525" fill="white" font-family="Georgia" font-size="58" font-weight="700">patrol aircraft</text><rect x="75" y="610" width="860" height="190" rx="26" fill="#fff" opacity=".11"/><text x="110" y="685" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">BAJO DE MASINLOC</text><text x="110" y="745" fill="white" font-family="Arial" font-size="26">AFP confirms Sept. 2 encounter</text><text x="75" y="995" fill="#F6EAF8" font-family="Arial" font-size="18">FMB-owned editorial visual · Not a documentary photograph</text></svg>