<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News social visual on the Bajo de Masinloc aircraft interception</title><desc id="d">Non-documentary FMB News graphic reporting the AFP-confirmed interception of a Philippine patrol aircraft by a Chinese J-10 over Bajo de Masinloc.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="80" width="220" height="220"/><text x="80" y="150" fill="#F9AB60" font-family="Arial" font-size="23" font-weight="700" letter-spacing="4">FMB NEWS · WEST PHILIPPINE SEA</text><text x="80" y="410" fill="white" font-family="Georgia" font-size="62" font-weight="700">Chinese fighter</text><text x="80" y="490" fill="white" font-family="Georgia" font-size="62" font-weight="700">intercepted PH</text><text x="80" y="570" fill="white" font-family="Georgia" font-size="62" font-weight="700">patrol aircraft</text><rect x="80" y="670" width="880" height="235" rx="28" fill="#fff" opacity=".11"/><text x="120" y="750" fill="#F9AB60" font-family="Arial" font-size="26" font-weight="700">BAJO DE MASINLOC</text><text x="120" y="815" fill="white" font-family="Arial" font-size="27">AFP confirms Sept. 2 encounter</text><text x="120" y="865" fill="white" font-family="Arial" font-size="27">during maritime patrol</text><text x="80" y="1245" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>