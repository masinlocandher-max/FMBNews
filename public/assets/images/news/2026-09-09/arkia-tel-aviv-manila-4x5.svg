<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News social visual on the announced Tel Aviv-Manila nonstop route</title><desc id="d">Non-documentary FMB News graphic on Arkia's announced weekly nonstop Tel Aviv-Manila service starting January 3, 2027.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="80" width="220" height="220"/><text x="80" y="150" fill="#F9AB60" font-family="Arial" font-size="23" font-weight="700" letter-spacing="4">FMB NEWS · TRAVEL</text><text x="80" y="420" fill="white" font-family="Georgia" font-size="62" font-weight="700">Tel Aviv–Manila</text><text x="80" y="500" fill="white" font-family="Georgia" font-size="62" font-weight="700">nonstop route</text><text x="80" y="580" fill="white" font-family="Georgia" font-size="62" font-weight="700">announced</text><rect x="80" y="680" width="880" height="235" rx="28" fill="#fff" opacity=".11"/><text x="120" y="760" fill="#F9AB60" font-family="Arial" font-size="26" font-weight="700">STARTS JANUARY 3, 2027</text><text x="120" y="825" fill="white" font-family="Arial" font-size="27">Arkia announces weekly</text><text x="120" y="875" fill="white" font-family="Arial" font-size="27">nonstop service to Manila</text><text x="80" y="1245" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>