<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News square visual on the announced Tel Aviv-Manila nonstop route</title><desc id="d">Non-documentary FMB News graphic on Arkia's announced weekly nonstop Tel Aviv-Manila service starting January 3, 2027.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="790" y="70" width="200" height="200"/><text x="75" y="135" fill="#F9AB60" font-family="Arial" font-size="22" font-weight="700" letter-spacing="4">FMB NEWS · TRAVEL</text><text x="75" y="385" fill="white" font-family="Georgia" font-size="58" font-weight="700">Tel Aviv–Manila</text><text x="75" y="460" fill="white" font-family="Georgia" font-size="58" font-weight="700">nonstop route</text><text x="75" y="535" fill="white" font-family="Georgia" font-size="58" font-weight="700">announced</text><rect x="75" y="620" width="860" height="190" rx="26" fill="#fff" opacity=".11"/><text x="110" y="695" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">JANUARY 3, 2027</text><text x="110" y="755" fill="white" font-family="Arial" font-size="26">Weekly Arkia service planned</text><text x="75" y="995" fill="#F6EAF8" font-family="Arial" font-size="18">FMB-owned editorial visual · Not a documentary photograph</text></svg>