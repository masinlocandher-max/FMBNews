<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
<title>FMB News editorial visual</title>
<desc>FMB News editorial mark, shown where no photograph has been cleared for this report. It is not a photograph and does not depict the event.</desc>
<defs>
<linearGradient id="fb-ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5F3EF"/><stop offset="1" stop-color="#FAF9F6"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#fb-ground)"/>
<rect x="0" y="0" width="1200" height="12" fill="#D71920"/>
<rect x="502" y="214" width="196" height="6" fill="#D71920"/>
<text x="600" y="358" text-anchor="middle" fill="#141414" font-family="Didot,'Bodoni 72',Baskerville,'Times New Roman',serif" font-size="104" letter-spacing="10">FMB NEWS</text>
<rect x="420" y="410" width="360" height="1.5" fill="#141414" fill-opacity=".34"/>
<text x="600" y="470" text-anchor="middle" fill="#6D7072" font-family="Didot,'Bodoni 72',Baskerville,'Times New Roman',serif" font-size="30" letter-spacing="9">FILIPINO MEDIA BULLETIN</text>
</svg>
