<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img">
<title>FMB News editorial visual</title>
<desc>FMB News metallic purple-violet editorial visual centered on the approved FMB icon.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08010f"/><stop offset=".42" stop-color="#24083d"/><stop offset=".72" stop-color="#4c1178"/><stop offset="1" stop-color="#0d0216"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#471163"/><stop offset=".18" stop-color="#d9b8ff"/><stop offset=".38" stop-color="#7129a4"/><stop offset=".58" stop-color="#f4eaff"/><stop offset=".78" stop-color="#8a3ac0"/><stop offset="1" stop-color="#2a0a43"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".44" r=".54"><stop offset="0" stop-color="#b264ff" stop-opacity=".55"/><stop offset="1" stop-color="#b264ff" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".6"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#glow)"/>
<circle cx="600" cy="318" r="232" fill="none" stroke="url(#metal)" stroke-width="3" opacity=".64"/>
<circle cx="600" cy="318" r="192" fill="#150620" stroke="#c78cff" stroke-opacity=".35" stroke-width="2"/>
<image href="/assets/images/icon-transparent.png" x="405" y="123" width="390" height="390" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>
<text x="600" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="7" fill="#d9b8ff">FMB NEWS</text>
<text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#d9b8ff">EDITORIAL VISUAL</text>
<rect x="170" y="635" width="860" height="2" fill="url(#metal)" opacity=".7"/>
</svg>