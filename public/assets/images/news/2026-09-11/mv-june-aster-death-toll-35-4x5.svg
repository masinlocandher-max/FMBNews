<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the MV June Aster death toll rising to 35</title><desc id="d">Non-documentary FMB News developing-story graphic reporting that 30 additional bodies were recovered from MV June Aster, raising the confirmed death toll to 35.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="90" width="210" height="210"/><text x="78" y="150" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="78" y="390" fill="white" font-family="Georgia" font-size="66" font-weight="700">June Aster</text><text x="78" y="475" fill="white" font-family="Georgia" font-size="66" font-weight="700">death toll rises</text><text x="78" y="560" fill="white" font-family="Georgia" font-size="66" font-weight="700">to 35</text><rect x="78" y="675" width="860" height="260" rx="30" fill="#fff" opacity=".11"/><text x="118" y="750" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">30 MORE BODIES RECOVERED</text><text x="118" y="820" fill="white" font-family="Arial" font-size="27">Search and identification continue</text><text x="118" y="865" fill="white" font-family="Arial" font-size="27">Cause remains under investigation</text><text x="78" y="1245" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>