<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Romualdez commitment order</title><desc id="d">Non-documentary FMB News social graphic reporting the Sandiganbayan commitment order designating the New Quezon City Jail for former House Speaker Martin Romualdez.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="735" y="80" width="230" height="230"/><text x="78" y="145" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">FMB NEWS · NATION</text><text x="78" y="405" fill="white" font-family="Georgia" font-size="66" font-weight="700">Court commits</text><text x="78" y="490" fill="white" font-family="Georgia" font-size="66" font-weight="700">Romualdez to</text><text x="78" y="575" fill="white" font-family="Georgia" font-size="58" font-weight="700">Quezon City jail custody</text><rect x="78" y="665" width="890" height="210" rx="28" fill="#fff" opacity=".11"/><text x="115" y="745" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">SEPTEMBER 10, 2026</text><text x="115" y="810" fill="white" font-family="Arial" font-size="27">Hospital-confinement request</text><text x="115" y="850" fill="white" font-family="Arial" font-size="27">remains before the court</text><text x="78" y="1230" fill="#F6EAF8" font-family="Arial" font-size="18">FMB-owned editorial visual · Not a documentary photograph</text><text x="78" y="1265" fill="#F6EAF8" font-family="Arial" font-size="18">Criminal allegations remain unproven</text></svg>