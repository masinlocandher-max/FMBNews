<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Romualdez commitment order</title><desc id="d">Non-documentary FMB News square graphic reporting the Sandiganbayan commitment order designating the New Quezon City Jail for former House Speaker Martin Romualdez.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="70" width="210" height="210"/><text x="75" y="135" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · NATION</text><text x="75" y="360" fill="white" font-family="Georgia" font-size="62" font-weight="700">Court commits</text><text x="75" y="440" fill="white" font-family="Georgia" font-size="62" font-weight="700">Romualdez to</text><text x="75" y="520" fill="white" font-family="Georgia" font-size="54" font-weight="700">Quezon City jail custody</text><rect x="75" y="605" width="890" height="175" rx="26" fill="#fff" opacity=".11"/><text x="112" y="675" fill="#F9AB60" font-family="Arial" font-size="23" font-weight="700">SEPTEMBER 10, 2026</text><text x="112" y="735" fill="white" font-family="Arial" font-size="26">Hospital request remains pending</text><text x="75" y="965" fill="#F6EAF8" font-family="Arial" font-size="17">FMB-owned editorial visual · Not a documentary photograph</text><text x="75" y="998" fill="#F6EAF8" font-family="Arial" font-size="17">Criminal allegations remain unproven</text></svg>