<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the MV June Aster death toll rising to 35</title><desc id="d">Non-documentary FMB News developing-story graphic reporting that 30 additional bodies were recovered from MV June Aster, raising the confirmed death toll to 35.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="770" y="75" width="210" height="210"/><text x="78" y="145" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="78" y="375" fill="white" font-family="Georgia" font-size="64" font-weight="700">June Aster death toll</text><text x="78" y="455" fill="white" font-family="Georgia" font-size="64" font-weight="700">rises to 35</text><rect x="78" y="570" width="850" height="215" rx="30" fill="#fff" opacity=".11"/><text x="118" y="645" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">30 MORE BODIES RECOVERED</text><text x="118" y="710" fill="white" font-family="Arial" font-size="26">Search and identification continue</text><text x="78" y="990" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>