<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on Saudi Arabia's East-West pipeline shutdown</title><desc id="d">Non-documentary FMB News developing-story graphic reporting that Saudi Arabia shut its East-West oil pipeline after a drone attack.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="90" width="210" height="210"/><text x="80" y="145" fill="#F9AB60" font-family="Arial" font-size="23" font-weight="700" letter-spacing="4">FMB WORLDWIDE · DEVELOPING</text><text x="80" y="380" fill="white" font-family="Georgia" font-size="60" font-weight="700">Saudi Arabia shuts</text><text x="80" y="465" fill="white" font-family="Georgia" font-size="60" font-weight="700">East-West oil pipeline</text><text x="80" y="550" fill="white" font-family="Georgia" font-size="56" font-weight="700">after drone attack</text><rect x="80" y="650" width="820" height="245" rx="28" fill="#fff" opacity=".11"/><text x="120" y="730" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">SAUDI ARABIA · SEPTEMBER 12</text><text x="120" y="805" fill="white" font-family="Arial" font-size="29">A key Hormuz-bypass route</text><text x="120" y="850" fill="white" font-family="Arial" font-size="29">is temporarily offline</text><text x="80" y="1240" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>