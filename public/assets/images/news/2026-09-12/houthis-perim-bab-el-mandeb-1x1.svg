<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the Houthi capture of Perim Island</title><desc id="d">Non-documentary FMB News developing-story graphic reporting that Houthi forces captured Perim Island in the Bab el-Mandeb Strait.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="755" y="70" width="210" height="210"/><text x="75" y="135" fill="#F9AB60" font-family="Arial" font-size="22" font-weight="700" letter-spacing="4">FMB WORLDWIDE · DEVELOPING</text><text x="75" y="380" fill="white" font-family="Georgia" font-size="58" font-weight="700">Houthis take</text><text x="75" y="455" fill="white" font-family="Georgia" font-size="58" font-weight="700">Perim Island</text><text x="75" y="525" fill="white" font-family="Georgia" font-size="43" font-weight="700">in Bab el-Mandeb</text><rect x="75" y="625" width="820" height="190" rx="28" fill="#fff" opacity=".11"/><text x="112" y="700" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">YEMEN · SEPTEMBER 11</text><text x="112" y="760" fill="white" font-family="Arial" font-size="26">Strategic Red Sea route under pressure</text><text x="75" y="1000" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>