<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the Houthi capture of Perim Island</title><desc id="d">Non-documentary FMB News developing-story graphic reporting that Houthi forces captured Perim Island in the Bab el-Mandeb Strait.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="735" y="90" width="235" height="235"/><text x="80" y="155" fill="#F9AB60" font-family="Arial" font-size="23" font-weight="700" letter-spacing="4">FMB WORLDWIDE · DEVELOPING</text><text x="80" y="430" fill="white" font-family="Georgia" font-size="60" font-weight="700">Houthis take</text><text x="80" y="510" fill="white" font-family="Georgia" font-size="60" font-weight="700">Perim Island</text><text x="80" y="590" fill="white" font-family="Georgia" font-size="48" font-weight="700">in Bab el-Mandeb</text><rect x="80" y="700" width="850" height="240" rx="30" fill="#fff" opacity=".11"/><text x="120" y="785" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">YEMEN · SEPTEMBER 11</text><text x="120" y="855" fill="white" font-family="Arial" font-size="28">New foothold inside a key</text><text x="120" y="900" fill="white" font-family="Arial" font-size="28">Red Sea shipping chokepoint</text><text x="80" y="1240" fill="#F6EAF8" font-family="Arial" font-size="20">FMB-owned editorial visual · Not a documentary photograph</text></svg>