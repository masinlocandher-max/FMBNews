<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on Saudi Arabia's East-West pipeline shutdown</title><desc id="d">Non-documentary FMB News developing-story graphic reporting that Saudi Arabia shut its East-West oil pipeline after a drone attack.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="780" y="70" width="190" height="190"/><text x="75" y="125" fill="#F9AB60" font-family="Arial" font-size="22" font-weight="700" letter-spacing="4">FMB WORLDWIDE · DEVELOPING</text><text x="75" y="335" fill="white" font-family="Georgia" font-size="56" font-weight="700">Saudi Arabia shuts</text><text x="75" y="410" fill="white" font-family="Georgia" font-size="56" font-weight="700">East-West oil pipeline</text><text x="75" y="485" fill="white" font-family="Georgia" font-size="50" font-weight="700">after drone attack</text><rect x="75" y="575" width="820" height="190" rx="26" fill="#fff" opacity=".11"/><text x="115" y="640" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">SAUDI ARABIA · SEPTEMBER 12</text><text x="115" y="705" fill="white" font-family="Arial" font-size="27">Key Hormuz-bypass route temporarily offline</text><text x="75" y="995" fill="#F6EAF8" font-family="Arial" font-size="18">FMB-owned editorial visual · Not a documentary photograph</text></svg>