<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the MV June Aster death toll rising to 76</title><desc id="d">Non-documentary FMB News square graphic reporting that the confirmed death toll in the MV June Aster ferry fire has risen to 76, with 13 people still missing.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="70" width="210" height="210"/><text x="80" y="125" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="80" y="390" fill="white" font-family="Georgia" font-size="60" font-weight="700">June Aster death toll</text><text x="80" y="475" fill="white" font-family="Georgia" font-size="68" font-weight="700">rises to 76</text><rect x="80" y="575" width="920" height="220" rx="28" fill="#fff" opacity=".11"/><text x="120" y="650" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">CORON, PALAWAN · SEPTEMBER 12</text><text x="120" y="715" fill="white" font-family="Arial" font-size="30">13 people remain missing.</text><text x="120" y="760" fill="white" font-family="Arial" font-size="26">Identification and investigation continue.</text><text x="80" y="990" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>