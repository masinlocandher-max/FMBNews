<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual on the MV June Aster death toll rising to 76</title><desc id="d">Non-documentary FMB News social graphic reporting that the confirmed death toll in the MV June Aster ferry fire has risen to 76, with 13 people still missing.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".55" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="720" y="90" width="230" height="230"/><text x="80" y="130" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="80" y="430" fill="white" font-family="Georgia" font-size="64" font-weight="700">June Aster</text><text x="80" y="515" fill="white" font-family="Georgia" font-size="64" font-weight="700">death toll rises</text><text x="80" y="600" fill="white" font-family="Georgia" font-size="64" font-weight="700">to 76</text><rect x="80" y="700" width="920" height="260" rx="28" fill="#fff" opacity=".11"/><text x="120" y="780" fill="#F9AB60" font-family="Arial" font-size="25" font-weight="700">CORON, PALAWAN · SEPTEMBER 12</text><text x="120" y="850" fill="white" font-family="Arial" font-size="31">13 people remain missing.</text><text x="120" y="905" fill="white" font-family="Arial" font-size="27">Identification and investigation continue.</text><text x="80" y="1240" fill="#F6EAF8" font-family="Arial" font-size="20">FMB-owned editorial visual · Not a documentary photograph</text></svg>