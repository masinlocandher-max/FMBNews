<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for BRICS New Delhi Declaration</title><desc id="d">Non-documentary FMB News graphic reporting adoption of the 2026 BRICS New Delhi Declaration.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="770" y="70" width="210" height="210"/><text x="80" y="125" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · WORLD</text><text x="80" y="350" fill="white" font-family="Georgia" font-size="58" font-weight="700">BRICS adopts</text><text x="80" y="425" fill="white" font-family="Georgia" font-size="58" font-weight="700">New Delhi Declaration</text><text x="80" y="505" fill="white" font-family="Georgia" font-size="44" font-weight="700">on war, trade and</text><text x="80" y="565" fill="white" font-family="Georgia" font-size="44" font-weight="700">global governance</text><rect x="80" y="650" width="900" height="180" rx="28" fill="#fff" opacity=".11"/><text x="120" y="725" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">SEPTEMBER 12, 2026 · NEW DELHI</text><text x="120" y="785" fill="white" font-family="Arial" font-size="28">Marcos attends as ASEAN chair</text><text x="80" y="975" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>