<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Metro Manila minimum wage rises by 60 pesos under Wage Order NCR-28</title><desc id="d">FMB News editorial graphic on the September 2026 Metro Manila minimum wage order. Not a documentary photograph.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><rect x="80" y="78" width="1440" height="744" rx="42" fill="#120720" fill-opacity=".48" stroke="#F9AB60" stroke-opacity=".4"/><image href="/assets/images/icon-transparent.png" x="1210" y="90" width="260" height="260"/><text x="120" y="170" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="6">FMB NEWS · LABOR</text><text x="120" y="340" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="80" font-weight="800">NCR MINIMUM WAGE</text><text x="120" y="438" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="80" font-weight="800">RISING BY ₱60</text><text x="120" y="545" fill="#F7D8FF" font-family="Arial,Helvetica,sans-serif" font-size="38">Wage Order NCR-28 takes effect September 26, 2026</text><line x1="120" y1="620" x2="1480" y2="620" stroke="#F9AB60" stroke-width="3" stroke-opacity=".7"/><text x="120" y="690" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="30">METRO MANILA · SEPTEMBER 2026</text><text x="120" y="774" fill="#D8CBE8" font-family="Arial,Helvetica,sans-serif" font-size="24">FMB-owned editorial visual · Not a documentary photograph</text></svg>