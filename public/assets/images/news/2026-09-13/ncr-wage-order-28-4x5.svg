<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">Metro Manila minimum wage rises by 60 pesos under Wage Order NCR-28</title><desc id="d">FMB News editorial graphic on the September 2026 Metro Manila minimum wage order. Not a documentary photograph.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><rect x="64" y="70" width="952" height="1210" rx="42" fill="#120720" fill-opacity=".48" stroke="#F9AB60" stroke-opacity=".4"/><image href="/assets/images/icon-transparent.png" x="780" y="92" width="220" height="220"/><text x="95" y="190" fill="#F9AB60" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="5">FMB NEWS · LABOR</text><text x="95" y="430" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800">NCR MINIMUM</text><text x="95" y="520" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800">WAGE RISING</text><text x="95" y="610" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="800">BY ₱60</text><text x="95" y="730" fill="#F7D8FF" font-family="Arial,Helvetica,sans-serif" font-size="34">Effective September 26, 2026</text><line x1="95" y1="850" x2="985" y2="850" stroke="#F9AB60" stroke-width="3" stroke-opacity=".7"/><text x="95" y="930" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="28">WAGE ORDER NCR-28</text><text x="95" y="1190" fill="#D8CBE8" font-family="Arial,Helvetica,sans-serif" font-size="22">FMB-owned editorial visual</text><text x="95" y="1230" fill="#D8CBE8" font-family="Arial,Helvetica,sans-serif" font-size="22">Not a documentary photograph</text></svg>