<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Martin Romualdez PGH assessment</title><desc id="d">Non-documentary FMB News graphic reporting Martin Romualdez's court-ordered transfer to Philippine General Hospital for an independent medical assessment.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="760" y="80" width="220" height="220"/><text x="80" y="130" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="80" y="355" fill="white" font-family="Georgia" font-size="64" font-weight="700">Romualdez</text><text x="80" y="440" fill="white" font-family="Georgia" font-size="64" font-weight="700">transferred to PGH</text><text x="80" y="525" fill="white" font-family="Georgia" font-size="52" font-weight="700">for independent</text><text x="80" y="595" fill="white" font-family="Georgia" font-size="52" font-weight="700">medical assessment</text><rect x="80" y="700" width="920" height="220" rx="28" fill="#fff" opacity=".11"/><text x="120" y="785" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">SEPTEMBER 12, 2026</text><text x="120" y="845" fill="white" font-family="Arial" font-size="29">PGH findings will guide the court's</text><text x="120" y="890" fill="white" font-family="Arial" font-size="29">next custody decision</text><text x="80" y="1235" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Allegations remain unproven</text><text x="80" y="1270" fill="#F6EAF8" font-family="Arial" font-size="19">Not a documentary photograph</text></svg>