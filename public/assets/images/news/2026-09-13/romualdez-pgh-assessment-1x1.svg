<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Martin Romualdez PGH assessment</title><desc id="d">Non-documentary FMB News graphic reporting Martin Romualdez's court-ordered transfer to Philippine General Hospital for an independent medical assessment.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="770" y="70" width="210" height="210"/><text x="80" y="125" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700" letter-spacing="5">FMB NEWS · DEVELOPING</text><text x="80" y="350" fill="white" font-family="Georgia" font-size="62" font-weight="700">Romualdez to PGH</text><text x="80" y="430" fill="white" font-family="Georgia" font-size="50" font-weight="700">for independent</text><text x="80" y="495" fill="white" font-family="Georgia" font-size="50" font-weight="700">medical assessment</text><rect x="80" y="600" width="900" height="180" rx="28" fill="#fff" opacity=".11"/><text x="120" y="675" fill="#F9AB60" font-family="Arial" font-size="24" font-weight="700">SEPTEMBER 12, 2026</text><text x="120" y="735" fill="white" font-family="Arial" font-size="28">Court awaits PGH findings on custody</text><text x="80" y="975" fill="#F6EAF8" font-family="Arial" font-size="19">FMB-owned editorial visual · Not a documentary photograph</text></svg>