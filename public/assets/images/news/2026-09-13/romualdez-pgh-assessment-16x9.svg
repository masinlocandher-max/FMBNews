<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FMB News editorial visual for Martin Romualdez PGH assessment</title><desc id="d">Non-documentary FMB News graphic reporting Martin Romualdez's court-ordered transfer to Philippine General Hospital for an independent medical assessment.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#220D50"/><stop offset=".58" stop-color="#630661"/><stop offset="1" stop-color="#F9AB60"/></linearGradient></defs><rect width="1600" height="900" fill="url(#g)"/><image href="/assets/images/icon-transparent.png" x="1210" y="90" width="260" height="260"/><text x="112" y="145" fill="#F9AB60" font-family="Arial" font-size="28" font-weight="700" letter-spacing="6">FMB NEWS · DEVELOPING</text><text x="112" y="305" fill="white" font-family="Georgia" font-size="72" font-weight="700">Romualdez transferred to PGH</text><text x="112" y="400" fill="white" font-family="Georgia" font-size="58" font-weight="700">for independent medical assessment</text><rect x="112" y="490" width="1160" height="175" rx="28" fill="#fff" opacity=".11"/><text x="155" y="560" fill="#F9AB60" font-family="Arial" font-size="27" font-weight="700">SEPTEMBER 12, 2026 · SANDIGANBAYAN ORDER</text><text x="155" y="620" fill="white" font-family="Arial" font-size="31">PGH findings will guide the court's next custody decision</text><text x="112" y="805" fill="#F6EAF8" font-family="Arial" font-size="21">FMB-owned editorial visual · Allegations remain unproven · Not a documentary photograph</text></svg>